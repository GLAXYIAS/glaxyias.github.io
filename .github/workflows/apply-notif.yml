name: Apply notification channels
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download updated chat files
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --max-time 180 'https://n.uguu.se/JXbJZFiyESoz.js' -o chat/chat.js
          curl -fsSL --retry 5 --retry-all-errors --max-time 180 'https://h.uguu.se/jGkxGtksdNnF.js' -o chat/sw.js
          curl -fsSL --retry 5 --retry-all-errors --max-time 180 'https://d.uguu.se/eLguPvpQLKYG.js' -o /tmp/chat-html.b64
          base64 -d /tmp/chat-html.b64 > chat/chat.html
      - name: Verify hashes
        run: |
          set -euo pipefail
          echo '1df409c662da3ca34e22ae41bae70a9f33648ac288b59ca190998dc2fe2a7e21  chat/chat.js' | sha256sum -c -
          echo 'c1a5caa3d0c3f8a1b2a7a784696432e2ec0ec81670787a8e853061c7d6f91ec0  chat/chat.html' | sha256sum -c -
          echo '8047e492bd849a464258d01e7034b7b3a5a04cafc30e657776fd3e8fd1216d53  chat/sw.js' | sha256sum -c -
      - name: Validate JavaScript and feature markers
        run: |
          set -euo pipefail
          node --check chat/chat.js
          node --check chat/sw.js
          grep -q 'toggle-notif-mentions' chat/chat.html
          grep -q 'CHAT_FETCH_LIMIT' chat/chat.js
          grep -q '20261126-notif3' chat/chat.html
          grep -q '20261126-notif3' chat/chat.js
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'notification-deploy'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chat/chat.js chat/chat.html chat/sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add selectable notification channels for PMs, mentions, announcements and moderation'
            git push origin HEAD:main
          fi
