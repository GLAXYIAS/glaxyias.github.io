name: Apply notification channels
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download updated chat files
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --max-time 180 'https://n.uguu.se/sLohQenzVOhe.js' -o chat/chat.js
          curl -fsSL --retry 5 --retry-all-errors --max-time 180 'https://h.uguu.se/kjQfBKoFeqUe.js' -o chat/sw.js
          curl -fsSL --retry 5 --retry-all-errors --max-time 180 'https://d.uguu.se/LbGcKxFXOUPt.js' -o /tmp/chat-html.b64
          base64 -d /tmp/chat-html.b64 > chat/chat.html
      - name: Verify hashes
        run: |
          set -euo pipefail
          echo '7b09eb0ba70eaf3fb9652f7e1e44474a3e54db636af802d55cef26f969e769e6  chat/chat.js' | sha256sum -c -
          echo '22989bc59ddde7e0d907969d2bf141176b71c008d1460e7e05eaf39debcfd6e1  chat/chat.html' | sha256sum -c -
          echo 'f80bd51f78317d53502bae758a088a52749ac2059814711cdb9591c5b86c5507  chat/sw.js' | sha256sum -c -
      - name: Validate JavaScript and feature markers
        run: |
          set -euo pipefail
          node --check chat/chat.js
          node --check chat/sw.js
          grep -q '20261127-pushmsg1' chat/chat.html
          grep -q '20261127-pushmsg1' chat/chat.js
          grep -q 'hasVisibleChatClient' chat/sw.js
          grep -q 'push-test' chat/chat.js
          grep -q 'toggle-notif-mentions' chat/chat.html
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'notification-deploy'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chat/chat.js chat/chat.html chat/sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Send closed-tab push for new general chat messages'
            git push origin HEAD:main
          fi
