name: Add missing game covers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate covers and update main.js
        run: python3 scripts/add_missing_covers.py
      - name: Remove duplicate orphan cards
        run: python3 scripts/remove_orphan_new_games.py
      - name: Add tags and tag filtering
        run: |
          if ! grep -q 'function getGameTags' JS/main.js; then
            python3 scripts/add_game_tags.py
          fi
      - name: Bump main.js cache version
        run: sed -i 's#JS/main.js?v=[^"]*#JS/main.js?v=20261113tags2#' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- JS/main.js index.html Games/_covers
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clean duplicate J cards and finalize tag filters"
          git push
