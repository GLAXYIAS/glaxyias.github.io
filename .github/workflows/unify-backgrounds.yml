      - name: Commit changes and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/themes.js JS/upgrade-pack.js index.html Settings/settings.html
          git commit -m "Unify background picker and dashboard themes"
          git rm .github/workflows/unify-backgrounds.yml
          git commit -m "Remove one-shot background workflow"
          git push
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/GLAXYIAS/glaxyias.github.io/actions/workflows/static.yml/dispatches \
            -d '{"ref":"main"}'
