name: fix-background-loop
on:
  push:
    paths:
      - '.github/workflows/fix-background-loop.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard the picker initializer against its own mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          p = Path('themes/themes.js')
          s = p.read_text()
          old = "\n".join([
              "  function initWhenReady() {",
              "    if (document.querySelector('.nx-bg-current')) window.nxInitBackgroundPicker(document);",
              "  }",
              "  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWhenReady);",
              "  else setTimeout(initWhenReady, 0);",
              "  try {",
              "    var observer = new MutationObserver(function () {",
              "      if (document.querySelector('.nx-bg-current')) window.nxInitBackgroundPicker(document);",
              "    });",
              "    observer.observe(document.body, { childList: true, subtree: true });",
              "  } catch (e) {}",
          ])
          new = "\n".join([
              "  var initialized = false;",
              "  function initWhenReady() {",
              "    if (initialized) return;",
              "    if (!document.querySelector('.nx-bg-current')) return;",
              "    initialized = true;",
              "    window.nxInitBackgroundPicker(document);",
              "  }",
              "  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWhenReady);",
              "  else setTimeout(initWhenReady, 0);",
              "  try {",
              "    var observer = new MutationObserver(function () {",
              "      if (!initialized) initWhenReady();",
              "    });",
              "    observer.observe(document.body, { childList: true, subtree: true });",
              "  } catch (e) {}",
          ])
          if s.count(old) != 1:
              sys.exit('picker init block not found exactly once: %d' % s.count(old))
          p.write_text(s.replace(old, new))

          page = Path('Settings/settings.html')
          html = page.read_text()
          html2, n = re.subn(r'themes/themes\.js\?v=[0-9A-Za-z]+', 'themes/themes.js?v=20261125allbg2', html)
          if n != 1:
              sys.exit('expected one themes.js tag, found %d' % n)
          page.write_text(html2)
          print('guarded picker init and bumped cache version')
          PY
          node --check themes/themes.js
      - name: Commit, clean up, and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "glaxyias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add themes/themes.js Settings/settings.html
          git commit -m "fix: stop the background picker initializer from looping on its own DOM changes"
          git push
          git rm .github/workflows/fix-background-loop.yml
          git commit -m "chore: remove the one-shot picker fix workflow"
          git push
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches" \
            -d '{"ref":"main"}'
