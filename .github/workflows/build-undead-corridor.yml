name: Build self-hosted Undead Corridor modes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-undead-corridor.yml"
      - "scripts/build-undead-modes.py"
      - "Games/undead-corridor/index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UnityPy
        run: python -m pip install --quiet UnityPy==1.25.4
      - name: Fetch original build for SceneLoading
        run: |
          git fetch --no-tags --depth=1 origin 1f35744edec5a34c771ea59b013d8c61ecc0b97f
          git show FETCH_HEAD:Games/undead-corridor/Build/undead-corridor-v26041701.data.unityweb > /tmp/undead-original.data
      - name: Build mode data
        run: >-
          python scripts/build-undead-modes.py
          --data Games/undead-corridor/Build/undead-corridor-v26041701.data.unityweb
          --bootstrap-data /tmp/undead-original.data
          --out-dir Games/undead-corridor/Build/modes
      - name: Commit mode data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Games/undead-corridor/Build/modes
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Build all self-hosted Undead Corridor game modes"
          git push
