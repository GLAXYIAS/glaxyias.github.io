name: Build self-hosted Undead Corridor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-undead-corridor.yml"
      - "scripts/build-undead-corridor.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UnityPy
        run: python -m pip install --quiet UnityPy==1.25.4
      - name: Build data
        run: python scripts/build-undead-corridor.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Games/undead-corridor/Build/undead-corridor-v26041701.data.unityweb
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Make Undead Corridor playable from self-hosted build"
          git push
