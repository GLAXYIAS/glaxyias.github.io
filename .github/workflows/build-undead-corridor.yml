name: Build self-hosted Undead Corridor modes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-undead-corridor.yml"
      - "scripts/build-undead-modes.py"
      - "Games/undead-corridor/index.html"

permissions:
  contents: write

concurrency:
  group: "undead-corridor-modes"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the original build files
        run: |
          git fetch --no-tags --depth=1 origin 1f35744edec5a34c771ea59b013d8c61ecc0b97f
          mkdir -p Games/undead-corridor/Build
          for file in loader.js framework.js.unityweb wasm.unityweb data.unityweb; do
            git show "FETCH_HEAD:Games/undead-corridor/Build/undead-corridor-v26041701.$file" \
              > "Games/undead-corridor/Build/undead-corridor-v26041701.$file"
          done
          cp Games/undead-corridor/Build/undead-corridor-v26041701.data.unityweb /tmp/undead-original.data
      - name: Install UnityPy
        run: python -m pip install --quiet UnityPy==1.25.4
      - name: Build mode data
        run: >-
          python scripts/build-undead-modes.py
          --data /tmp/undead-original.data
          --bootstrap-data /tmp/undead-original.data
          --out-dir Games/undead-corridor/Build/modes
      - name: Commit mode data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Games/undead-corridor/Build
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Build self-hosted Undead Corridor mode data"
          git push
