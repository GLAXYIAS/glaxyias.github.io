name: Chat notification fix
on:
  push:
    paths:
      - .github/workflows/notif-fix.yml
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply notification patch
        run: |
          cat .github/notif-parts/p0 .github/notif-parts/p1 .github/notif-parts/p2 .github/notif-parts/p3 .github/notif-parts/p4 .github/notif-parts/p5 > /tmp/notif.gz
          gunzip -c /tmp/notif.gz > /tmp/notif.patch
          git apply --whitespace=nowarn /tmp/notif.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat/chat.js chat/chat.html chat/sw.js
          git rm -r .github/notif-parts .github/workflows/notif-fix.yml
          git commit -m "Fix chat notifications so they fire reliably"
          git push
      - name: Deploy to Pages
        run: gh workflow run static.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
