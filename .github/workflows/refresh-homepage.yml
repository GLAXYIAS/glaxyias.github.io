name: Refresh homepage prototype (one-shot)

on:
  push:
    paths:
      - '.github/workflows/refresh-homepage.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply homepage patch
        run: python3 .github/homepage_refresh.py brand-new-start-up-screen/index.html

      - name: Verify
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('brand-new-start-up-screen/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          pathlib.Path('/tmp/homepage.js').write_text(scripts[-1])
          for token in ['id="homeView"', 'id="libraryView"', 'data-open-library', 'function setView', 'body.is-library']:
              if token not in html:
                  raise SystemExit(f'missing {token}')
          print('structure OK')
          PY
          node --check /tmp/homepage.js
          grep -q 'Five minutes before class' brand-new-start-up-screen/index.html
          grep -q 'Saved games' brand-new-start-up-screen/index.html
          grep -q 'tabindex="-1" hidden' brand-new-start-up-screen/index.html

      - name: Commit and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-new-start-up-screen/index.html
          git rm .github/workflows/refresh-homepage.yml .github/homepage_refresh.py
          git commit -m "Make Games and Saved fill the page with the library"
          pushed=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 5
            git pull --rebase origin main
          done
          test "$pushed" = 1
          sleep 5
          gh workflow run static.yml --ref main
