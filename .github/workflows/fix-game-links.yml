name: Fix dead game links

on:
  push:
    paths:
      - ".github/workflows/fix-game-links.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fix-game-links
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair catalog URLs
        run: |
          python3 - <<'PY'
          import re

          path = "JS/main.js"
          src = open(path, encoding="utf-8").read()

          REMAP = {
              "https://whatchamacallitexe.github.io/pack-a/crossy-road/":
                  "https://whatchamacallitexe.github.io/pack-n/crossy-road/",
              "https://whatchamacallitexe.github.io/pack-c/cut-the-rope/":
                  "https://whatchamacallitexe.github.io/pack-n/cut-the-rope/",
              "https://whatchamacallitexe.github.io/pack-b/cookie-clicker/":
                  "https://whatchamacallitexe.github.io/pack-n/cookie-clicker/",
              "https://whatchamacallitexe.github.io/pack-d/bob-the-robber-2/":
                  "https://whatchamacallitexe.github.io/pack-n/bob-the-robber-2/",
              "https://whatchamacallitexe.github.io/pack-b/go-ball/":
                  "https://whatchamacallitexe.github.io/pack-a/go-ball/index.html",
              "https://whatchamacallitexe.github.io/pack-j/getting-over-it/":
                  "https://whatchamacallitexe.github.io/pack-s/gettingoverit/index.html",
              "https://whatchamacallitexe.github.io/pack-i/a-dark-room/":
                  "https://whatchamacallitexe.github.io/pack-l/a-dark-room/index.html",
              "https://whatchamacallitexe.github.io/pack-g/wheely-2/":
                  "https://whatchamacallitexe.github.io/pack-ap/wheely2/index.html",
          }

          # Folders that contain assets only; the game entry page was never imported.
          REMOVE = [
              "3-pandas-in-japan",
              "bloons-tower-defense-4",
              "checkers-legend",
              "farm-match",
              "plants-vs-zombies",
              "there-is-no-game",
              "tower-crash-3d",
              "fruit-ninja",
              "animal-io",
              "g-switch",
              "happy-hop",
              "ovo",
              "football-brawl",
              "basket-and-ball",
              "om-nom-bounce",
          ]

          changed = 0
          for old, new in REMAP.items():
              needle = 'url: "%s"' % old
              if needle in src:
                  src = src.replace(needle, 'url: "%s"' % new)
                  changed += 1

          removed = 0
          for gid in REMOVE:
              pattern = r'^[ \t]*\{[ \t]*id:[ \t]*"%s".*\n?' % re.escape(gid)
              src, n = re.subn(pattern, "", src, flags=re.MULTILINE)
              removed += n

          open(path, "w", encoding="utf-8").write(src)
          print("remapped urls:", changed)
          print("removed cards:", removed)
          PY

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JS/main.js
          if git diff --cached --quiet; then
            echo "already fixed"
          else
            git commit -m "Repair game catalog links that returned GitHub 404s"
            git push origin HEAD:main
          fi
          gh workflow run static.yml --ref main
