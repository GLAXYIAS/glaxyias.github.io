name: Version standalone settings theme script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Settings/settings.html')
          s = p.read_text()
          s = s.replace('<script src="../themes/themes.js"></script>', '<script src="../themes/themes.js?v=20261124darker4"></script>')
          p.write_text(s)
          PY

      - name: Remove this one-off workflow
        run: rm .github/workflows/nx-bg-fix3.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Settings/settings.html .github/workflows/nx-bg-fix3.yml
          git commit -m "Version standalone settings theme script"
          git push
