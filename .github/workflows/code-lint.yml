# Fast repository sanity checks on every push to main.
# Replaces the old "Code Quality & Lint Check" file, which was commented out but
# stayed registered on GitHub, so it kept running its last definition and failing.
name: Repo Health Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JSON manifests
        run: |
          python3 - <<'PY'
          import json, sys
          files = ["package.json", "package-lock.json", "version.json", "vercel.json"]
          bad = []
          for name in files:
              try:
                  with open(name, encoding="utf-8") as fh:
                      json.load(fh)
              except FileNotFoundError:
                  print(f"skip (missing): {name}")
              except Exception as exc:
                  bad.append(f"{name}: {exc}")
          for problem in bad:
              print(f"::error file={problem.split(':')[0]}::{problem}")
          print("JSON manifests OK." if not bad else "JSON manifests invalid.")
          sys.exit(1 if bad else 0)
          PY

      - name: Check workflow YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, glob, yaml
          bad = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  with open(path, encoding="utf-8") as fh:
                      doc = yaml.safe_load(fh)
                  # PyYAML parses an unquoted `on:` key as boolean True
                  if not isinstance(doc, dict) or not any(k in doc for k in ("on", True)) or "jobs" not in doc:
                      bad.append(f"{path}: not a runnable workflow (needs 'on' and 'jobs')")
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          for problem in bad:
              print(f"::error::{problem}")
          print("Workflow YAML OK." if not bad else "Workflow YAML invalid.")
          sys.exit(1 if bad else 0)
          PY

      - name: Check site entry points exist
        run: |
          missing=0
          for f in index.html TOS/TOS.html JS/tos-gate.js themes/themes.css; do
            if [ ! -s "$f" ]; then echo "::error::Missing or empty: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] && echo "Site entry points present."
