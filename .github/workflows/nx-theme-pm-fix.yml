name: Apply orange theme and PM read fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply changes
        run: python3 .github/scripts/nx-theme-pm-fix.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add index.html CSS/style.css CSS/upgrade-pack.css themes/themes.css Settings/settings.html chat/chat.js
          git commit -m "Switch default theme to black and orange; fix PM read state"
          git push
