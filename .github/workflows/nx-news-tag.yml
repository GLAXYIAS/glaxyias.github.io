name: Make News tags black

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply changes
        run: python3 .github/scripts/nx-news-tag.py

      - name: Remove this one-off workflow
        run: |
          rm .github/workflows/nx-news-tag.yml
          rm .github/scripts/nx-news-tag.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS/black-orange.css index.html .github/workflows/nx-news-tag.yml .github/scripts/nx-news-tag.py
          git commit -m "Make News tags black with orange outlines"
          git push
