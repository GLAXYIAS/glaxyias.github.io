name: Add Filters Modal (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply the Filters button and modal patch
        run: python3 .github/scripts/apply-filters-modal.py

      - name: Verify the patched site
        run: |
          test -s JS/filters-modal.js
          test -s CSS/filters-modal.css
          node --check JS/filters-modal.js
          node --check JS/main.js
          node --check JS/fragen-17-games-v2.js
          grep -q 'filtersTrigger' index.html
          grep -q 'CSS/filters-modal.css?v=20261125filters1' index.html
          grep -q 'JS/filters-modal.js?v=20261125filters1' index.html
          grep -q 'JS/main.js?v=20261125filters1' index.html
          grep -q 'JS/fragen-17-games-v2.js?v=20261125filters1' index.html
          grep -q 'filtersModalOpen' JS/main.js
          ! grep -q 'data-player-filter="all"' index.html

      - name: Commit, remove this one-shot workflow, and trigger Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html JS/main.js JS/fragen-17-games-v2.js JS/filters-modal.js CSS/filters-modal.css
          git rm .github/workflows/apply-filters-modal.yml .github/scripts/apply-filters-modal.py
          git commit -m "Combine game filters into a Filters modal"
          pushed=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 5
            git pull --rebase origin main
          done
          test "$pushed" = 1
          sleep 5
          gh workflow run static.yml --ref main
