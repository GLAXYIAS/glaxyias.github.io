name: Apply pure black and orange theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply changes
        run: python3 .github/scripts/nx-black-orange.py

      - name: Remove this one-off workflow
        run: |
          rm .github/workflows/nx-black-orange.yml
          rm .github/scripts/nx-black-orange.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JS/upgrade-pack.js themes/themes.css CSS/style.css CSS/black-orange.css index.html .github/workflows/nx-black-orange.yml .github/scripts/nx-black-orange.py
          git commit -m "Use pure black surfaces with orange text and outlines"
          git push
