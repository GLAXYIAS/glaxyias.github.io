name: assemble startup screen

on:
  push:
    paths:
      - ".nxparts/assemble.trigger"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build single file
        run: |
          set -euo pipefail
          out="brand new start up screen"
          mkdir -p "$out"
          cat .nxparts/01-head.html \
              .nxparts/02-style-a.css \
              .nxparts/02-style-b.css \
              .nxparts/03-body.html \
              .nxparts/04-data.js \
              .nxparts/06-app.js \
              .nxparts/05-tail.txt > "$out/index.html"
          echo "lines: $(wc -l < "$out/index.html")"
          rm -rf .nxparts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add refurbished startup screen"
          git push
