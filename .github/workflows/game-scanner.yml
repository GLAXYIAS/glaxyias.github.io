name: Scan GitHub Pages Repositories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Add write permission for contents (allows committing and pushing)
permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Repo Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scan_repos.py

      - name: Commit updated JS/main.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add JS/main.js
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update JS/main.js with new games" && git push)
