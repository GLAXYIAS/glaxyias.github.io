name: Fix parser escape v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the broken compare line
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("scripts/add_actual_covers.py", "scripts/sharpen_game_tags.py"):
              path = Path(name)
              lines = path.read_text(encoding="utf-8").splitlines()
              changed = False
              for index, line in enumerate(lines):
                  if "elif ch ==" in line and line.rstrip().endswith('":'):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[index] = indent + "elif ch == chr(92):"
                      changed = True
                      break
              if not changed:
                  raise SystemExit(f"compare line not found in {name}")
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/add_actual_covers.py scripts/sharpen_game_tags.py
          git commit -m "Repair parser compare line"
          git push origin HEAD:main
