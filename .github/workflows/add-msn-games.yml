# one-shot import: download the builds, commit them, then remove this workflow
name: Add Zombie Derby and Ragdoll Archers

on:
  push:
    paths:
      - .github/workflows/add-msn-games.yml

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the two builds
        run: bash tools/mirror-new-games.sh
      - name: Commit and self-destruct
        run: |
          git config user.name "plzdownloadfree.exe"
          git config user.email "whatchamacallit.exe@neirmail.com"
          git add Games/zombie-derby-2 Games/ragdoll-archers
          git commit -m "Add Zombie Derby Part II and Ragdoll Archers"
          git rm -q .github/workflows/add-msn-games.yml
          git commit -m "Remove the one-shot game import workflow"
          git push origin HEAD:main
