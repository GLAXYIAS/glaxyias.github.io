name: Import MrMine

on:
  push:
    paths:
      - .github/workflows/import-mrmine.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the game and add its catalogue card
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import pathlib
          import re
          import urllib.request

          BASE = 'https://mrmine.com/game/desktop/'
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          root = pathlib.Path('Games/mr-mine')
          root.mkdir(parents=True, exist_ok=True)

          html = get(BASE + 'index.html').decode('utf-8', 'replace')
          refs = sorted(set(re.findall(r'(?:src|href)="([^"]+)"', html)))
          local = [r for r in refs if not r.startswith(('http', '//', 'data:', '#', 'mailto:'))]

          jobs = []
          for ref in local:
              clean = ref.split('?')[0].split('#')[0]
              if clean.startswith('../'):
                  jobs.append((BASE + clean, root / clean[3:]))
              elif clean.endswith('/') or not clean:
                  continue
              else:
                  jobs.append((BASE + clean, root / clean))

          def fetch(job):
              url, target = job
              try:
                  data = get(url)
              except Exception:
                  return
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              list(ex.map(fetch, jobs))

          assets = set()
          for f in root.rglob('*.js'):
              t = f.read_text(encoding='utf-8', errors='replace')
              for m in re.findall(r'"([A-Za-z0-9_./-]+\.(?:png|webp|jpg|jpeg|gif|wav|mp3|ogg|ttf|woff2?|json|svg))"', t):
                  if not m.startswith(('http', 'data:')):
                      assets.add(m.lstrip('./'))

          jobs = [(BASE + p, root / p) for p in sorted(assets) if not (root / p).exists()]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              list(ex.map(fetch, jobs))

          html = re.sub(r'<script[^>]*src="https://cdn\.trackjs\.com[^"]*"[^>]*>\s*</script>', '', html)
          html = html.replace('"../web.js', '"web.js').replace("'../web.js", "'web.js")
          bar = ('<a href="../../index.html" style="position:fixed;top:10px;left:10px;z-index:2147483647;'
                 'padding:8px 12px;border-radius:10px;background:rgba(12,16,22,.82);color:#fff;'
                 'font:600 15px/1 system-ui,sans-serif;text-decoration:none;'
                 'border:1px solid rgba(255,255,255,.25)">&#8592; Games</a>')
          html = html.replace('</body>', bar + '\n</body>')
          (root / 'index.html').write_text(html, encoding='utf-8')

          cover = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33210f"/><stop offset="1" stop-color="#0c0906"/></linearGradient></defs>
            <rect width="512" height="512" fill="url(#g)"/>
            <g fill="#f6c945" stroke="#a9781a" stroke-width="6">
              <ellipse cx="256" cy="330" rx="120" ry="52"/>
              <ellipse cx="256" cy="318" rx="120" ry="52"/>
            </g>
            <text x="256" y="330" text-anchor="middle" font-family="Verdana,sans-serif" font-size="54" font-weight="700" fill="#5b3c0c">Mr.</text>
            <path d="M150 300 L360 96" stroke="#c9d4e2" stroke-width="26" stroke-linecap="round"/>
            <path d="M300 70 q78 8 116 54 q-84 10 -116 -6 z" fill="#c9d4e2" stroke="#8d9aab" stroke-width="6"/>
            <text x="256" y="440" text-anchor="middle" font-family="Verdana,sans-serif" font-size="58" font-weight="700" fill="#f6c945">Mine</text>
          </svg>'''
          (root / 'cover.svg').write_text(cover, encoding='utf-8')

          card = ('    {\n'
                  '      id: "mr-mine",\n'
                  '      title: "Mr.Mine",\n'
                  '      url: "../Games/mr-mine/index.html",\n'
                  '      desc: "Dig deeper, hire managers, unlock drills and rebuild your mining empire in the long-running idle mining game.",\n'
                  '      image: "../Games/mr-mine/cover.svg",\n'
                  '      tags: ["Idle", "Mining", "Simulation"]\n'
                  '    }')

          cat = pathlib.Path('JS/fragen-17-games-v2.js')
          text = cat.read_text(encoding='utf-8')
          anchor = ('      image: "../Games/car-destruction-king/cover.svg",\n'
                    '      tags: ["Driving", "Sandbox", "Action"]\n'
                    '    }\n'
                    '  ];')
          assert text.count(anchor) == 1, 'catalogue anchor missing'
          text = text.replace(anchor, anchor[:-5] + ',\n' + card + '\n  ];')

          ids = '    "car-destruction-king",\n  ];'
          assert text.count(ids) == 1, 'NON_HTML anchor missing'
          text = text.replace(ids, '    "car-destruction-king",\n    "mr-mine",\n  ];')
          cat.write_text(text, encoding='utf-8')
          print('mirrored MrMine and patched the catalogue')
          PY
          git config user.name "plzdownloadfree.exe"
          git config user.email "whatchamacallit.exe@neirmail.com"
          git add -A
          git commit -m "Add the MrMine mirror and catalogue card"
          git rm -q .github/workflows/import-mrmine.yml
          git commit -m "Remove the one-shot MrMine import workflow"
          git push origin HEAD:main
