name: nx rename and logo

on:
  push:
    paths:
      - ".github/workflows/nx-rename-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move folder and swap in the Null_X logo
        run: |
          git mv "brand new start up screen" brand-new-start-up-screen

          python3 - <<'PY'
          import sys

          path = "brand-new-start-up-screen/index.html"
          src = open(path, encoding="utf-8").read()

          logo = "../imgs/Screenshot%202026-01-27%208.17.07%20PM.png"
          mark22 = '<svg class="mark" width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18"/><path d="M4.4 15.6 15.6 4.4M4.4 4.4l11.2 11.2"/></svg>'
          mark18 = '<svg class="mark" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18"/><path d="M4.4 15.6 15.6 4.4M4.4 4.4l11.2 11.2"/></svg>'
          img_lg = '<img class="logo-img logo-img--lg" src="' + logo + '" alt="Null X" width="44" height="44">'
          img_sm = '<img class="logo-img logo-img--sm" src="' + logo + '" alt="" width="20" height="20">'
          anchor = '.rail__brand:hover{border-color:rgba(224,122,0,.6);background:rgba(224,122,0,.06)}'
          css = anchor + """
          .rail__brand{overflow:hidden}

          .logo-img{display:block;object-fit:cover;object-position:50% 50%;background:#f5f1e9}
          .logo-img--sm{width:20px;height:20px;border-radius:2px;flex:none}
          .logo-img--lg{width:100%;height:100%}"""

          if src.count(mark22) != 1:
              raise SystemExit("rail mark count: %d" % src.count(mark22))
          if src.count(mark18) != 2:
              raise SystemExit("small mark count: %d" % src.count(mark18))
          if src.count(anchor) != 1:
              raise SystemExit("css anchor count: %d" % src.count(anchor))

          src = src.replace(mark22, img_lg, 1)
          src = src.replace(mark18, img_sm, 2)
          src = src.replace(anchor, css, 1)

          style = src.split("<style>", 1)[1].split("</style>", 1)[0]
          if style.count("{") != style.count("}"):
              raise SystemExit("unbalanced css braces")

          open(path, "w", encoding="utf-8").write(src)
          print("patched logo + css (%d bytes)" % len(src))
          PY

      - name: Commit and retire this workflow
        run: |
          rm -f .github/workflows/nx-rename-logo.yml
          git config user.name "glaxyias"
          git config user.email "Sparefornow2026@outlook.com"
          git add -A
          git commit -m "startup screen: space-free folder and the Null_X logo"
          git push
