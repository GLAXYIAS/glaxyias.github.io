name: Mirror Stickman Battle (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download the official build and patch the site
        run: python3 .github/scripts/mirror_stickman.py

      - name: Verify the mirrored build
        run: |
          test -s Games/stickman-battle/index.html
          test -s Games/stickman-battle/poki-sdk-stub.js
          test "$(find Games/stickman-battle -type f | wc -l)" -ge 70
          ! grep -q 'game-cdn.poki.com' Games/stickman-battle/index.html
          grep -q 'Games/stickman-battle/index.html' JS/main.js
          grep -q 'main.js?v=20261125local1' index.html

      - name: Commit, remove this one-shot workflow, and trigger Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Games/stickman-battle JS/main.js index.html
          git rm .github/workflows/mirror-stickman-battle.yml .github/scripts/mirror_stickman.py
          git commit -m "Mirror Stickman Battle locally from the official Poki build"
          pushed=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 5
            git pull --rebase origin main
          done
          test "$pushed" = 1
          sleep 5
          gh workflow run static.yml --ref main
