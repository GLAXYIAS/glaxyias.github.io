name: Clean game list

# Removes duplicate games and every GitLab game from JS/main.js, then deploys the result.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: clean-game-list
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Drop duplicates and GitLab games
        run: node scripts/fix-mainjs.cjs JS/main.js JS/main.js
      - name: Commit the result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JS/main.js
          if git diff --cached --quiet; then
            echo "game list already clean"
            exit 0
          fi
          git commit -m "Remove duplicate games and GitLab games from the game list"
          git push

      # Pushes made with the workflow token do not start other workflows.
      - name: Deploy the cleaned site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run static.yml --ref main --repo "$GITHUB_REPOSITORY"
