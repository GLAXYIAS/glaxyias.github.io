name: Patch Azgames pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Replace removed analytics helpers with no-ops
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re

          stub = (
              "<script>\n"
              "function firebaseSetUserProperties() {}\n"
              "function firebaseLogEvent() {}\n"
              "function firebaseLogEventParameter() {}\n"
              "</script>"
          )

          for slug in ("ragdoll-playground", "orbit-kick"):
              path = pathlib.Path("Games") / slug / "index.html"
              src = path.read_text(encoding="utf-8")
              src, hits = re.subn(
                  r"<script>\s*function firebaseSetUserProperties.*?</script>",
                  stub,
                  src,
                  count=1,
                  flags=re.S,
              )
              if hits != 1:
                  raise SystemExit("helper block not found: " + slug)
              path.write_text(src, encoding="utf-8")
              print("patched", slug)
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Games/ragdoll-playground/index.html Games/orbit-kick/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Stub analytics helpers in mirrored games"
          git push origin HEAD:main
