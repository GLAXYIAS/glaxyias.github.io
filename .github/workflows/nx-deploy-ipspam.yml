name: nx-deploy-ipspam

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and unpack changed files
        run: |
          set -euo pipefail
          page="$(curl -fsSL 'https://tmpfiles.org/wKAbvjrCBVQ3/nx-deploy.zip')"
          url="$(printf '%s' "$page" | grep -oE 'https://tmpfiles.org/dl/[^"]+' | head -1)"
          test -n "$url"
          curl -fsSL "$url" -o /tmp/nx-deploy.zip
          echo '80e24bd098a0b4d29aed2146f7ed3a636559531b1c021a7c1e4372462c7950e8  /tmp/nx-deploy.zip' | sha256sum -c -
          unzip -o /tmp/nx-deploy.zip -d .
          git status --short
          git diff --stat
      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'nx-deploy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add BAN/guard.js Login/login.html chat/chat.html chat/chat-actions.js chat/chat.js
          git commit -m 'Add IP ban tracking and escalating chat cooldown'
          git push origin HEAD:main
