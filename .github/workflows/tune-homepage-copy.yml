name: Tune homepage copy (one-shot)

on:
  push:
    paths:
      - '.github/workflows/tune-homepage-copy.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply copy patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('brand-new-start-up-screen/index.html')
          src = path.read_text(encoding='utf-8')
          replacements = [
              ('d:"The newest version of Brotato with the All Pain No Gain update."',
               'd:"Brotato with the All Pain No Gain update. The whole pitch."'),
              ('d:"Clover Pit is a roguelite gambling game where you spin, bet, and chase huge payouts while trying not to go broke."',
               'd:"A roguelite gambling game. Spin, bet, chase a payout, try not to go broke."'),
              ('d:"A fast-paced low-poly racing game with crisp drifting controls."',
               'd:"Low-poly racing with drifting that actually feels good."'),
              ('d:"Race through explosive obstacle courses packed with ramps, traps, and high-speed motorcycle stunts."',
               'd:"Ramps, traps, and a bike. Try not to crash."'),
              ('d:"Play Slither Io online in your browser."',
               'd:"The snake game. You already know it."'),
              ('d:"Build, box fight and drop into battle royale in a fast browser shooter with 1v1 Clash, Zone Wars and creative mode."',
               'd:"Build, box fight, or drop into a battle royale. 1v1 Clash and Zone Wars too."'),
          ]
          for old, new in replacements:
              if src.count(old) != 1:
                  raise SystemExit('Expected exactly one match: ' + old)
              src = src.replace(old, new, 1)
          path.write_text(src, encoding='utf-8')
          print('copy patched')
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('brand-new-start-up-screen/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          pathlib.Path('/tmp/homepage.js').write_text(scripts[-1], encoding='utf-8')
          for token in ['The whole pitch', 'try not to go broke', 'actually feels good', 'Try not to crash', 'already know it', 'Zone Wars too']:
              if token not in html:
                  raise SystemExit('missing ' + token)
          print('structure OK')
          PY
          node --check /tmp/homepage.js

      - name: Commit and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-new-start-up-screen/index.html
          git rm .github/workflows/tune-homepage-copy.yml
          git commit -m "Loosen up the homepage game blurbs"
          pushed=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 5
            git pull --rebase origin main
          done
          test "$pushed" = 1
          sleep 5
          gh workflow run static.yml --ref main
