name: Point the home page at the direct game launcher

on:
  push:
    paths:
      - .github/workflows/fragen-17-index.yml

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace the game loader on the home page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text()
          old = '<script src="JS/fragen-17-games.js?v=20261117"></script>'
          new = '<script src="JS/fragen-17-games-v2.js?v=20261117b"></script>'
          if old not in html:
              raise SystemExit("old game loader tag not found")
          path.write_text(html.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use the direct Fragen and 17-0 launcher"
          git push
