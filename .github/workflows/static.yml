# Deploy the repository to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel a deployment that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stamp the build timestamp into the artifact that gets deployed.
      # This deliberately does NOT commit or force-push back to main: amending the
      # commit on every run rewrote history, started extra Pages builds and made
      # overlapping runs fail. The deployed site still serves a fresh version.json.
      - name: Stamp version.json for this deployment
        run: |
          printf '{"version": %s}\n' "$(date +%s%3N)" > version.json
          cat version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
