name: Make Console button black

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply changes
        run: python3 .github/scripts/nx-console-orange.py

      - name: Remove this one-off workflow
        run: |
          rm .github/workflows/nx-console-orange.yml
          rm .github/scripts/nx-console-orange.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS/black-orange.css index.html .github/workflows/nx-console-orange.yml .github/scripts/nx-console-orange.py
          git commit -m "Make Console button black with orange outline"
          git push
