name: Fix second launch

on:
  push:
    paths:
      - .github/workflows/fix-second-launch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the game shell
        run: |
          python3 patches/fix-second-launch.py
          git config user.name "plzdownloadfree.exe"
          git config user.email "whatchamacallit.exe@neirmail.com"
          git add JS/main.js
          git commit -m "Keep the game loader from getting stuck on a second launch"
          git rm -q .github/workflows/fix-second-launch.yml patches/fix-second-launch.py
          git commit -m "Remove the one-shot second-launch fix workflow"
          git push origin HEAD:main
