name: fix-background-cards
on:
  push:
    paths:
      - '.github/workflows/fix-background-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop the background cards collapsing and round the previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          css_path = Path('Settings/backgrounds.css')
          css = css_path.read_text()
          old_rule = "\n".join([
              ".nx-bg-choice {",
              "  position: relative;",
              "  display: block !important;",
              "  width: 100%;",
              "  padding: 0 !important;",
              "  overflow: hidden;",
          ])
          new_rule = "\n".join([
              ".nx-bg-choice {",
              "  position: relative;",
              "  display: block !important;",
              "  width: 100%;",
              "  padding: 0 !important;",
              "  overflow: visible;",
          ])
          if css.count(old_rule) != 1:
              sys.exit('choice rule not found exactly once: %d' % css.count(old_rule))
          css = css.replace(old_rule, new_rule)

          old_img = "\n".join([
              ".nx-bg-choice img {",
              "  display: block;",
              "  width: 100%;",
              "  aspect-ratio: 16 / 10;",
              "  object-fit: cover;",
          ])
          new_img = "\n".join([
              ".nx-bg-choice img {",
              "  display: block;",
              "  width: 100%;",
              "  aspect-ratio: 16 / 10;",
              "  object-fit: cover;",
              "  border-radius: 9px 9px 0 0;",
          ])
          if css.count(old_img) != 1:
              sys.exit('image rule not found exactly once: %d' % css.count(old_img))
          css = css.replace(old_img, new_img)
          css_path.write_text(css)

          page = Path('Settings/settings.html')
          html = page.read_text()
          html2, n = re.subn(r'backgrounds\.css\?v=[0-9A-Za-z]+', 'backgrounds.css?v=20261125bggrid', html)
          if n != 1:
              sys.exit('expected one backgrounds.css tag, found %d' % n)
          page.write_text(html2)
          print('cards fixed and css cache version bumped')
          PY
      - name: Commit, clean up, and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "glaxyias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Settings/backgrounds.css Settings/settings.html
          git commit -m "fix: make restored background cards render their previews at full height"
          git push
          git rm .github/workflows/fix-background-cards.yml
          git commit -m "chore: remove the one-shot background card fix workflow"
          git push
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches" \
            -d '{"ref":"main"}'
