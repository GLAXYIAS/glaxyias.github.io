name: Remove remaining unplayable entries
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prune catalog
        env:
          LINES: "3638,4816,5151,5224,5328,5348,5368,7546,7773,8818"
          EXPECTED_SHA: "2215b1220d35bdb0302dc35507131bd6a14f98aab10c35ffc937ff9008ccb5fd"
        run: |
          python3 - <<'PY'
          import os, hashlib
          p = 'JS/main.js'
          src = open(p, encoding='utf-8').read()
          sha = hashlib.sha256(src.encode()).hexdigest()
          assert sha == os.environ['EXPECTED_SHA'], 'unexpected main.js: ' + sha
          lines = src.split('\n')
          drop = {int(x) for x in os.environ['LINES'].split(',')}
          out = [line for i, line in enumerate(lines, 1) if i not in drop]
          open(p, 'w', encoding='utf-8').write('\n'.join(out))
          print('removed', len(lines) - len(out), 'remaining', len(out))
          PY
      - name: Commit
        run: |
          git config user.name "glaxyias-bot"
          git config user.email "bot@users.noreply.github.com"
          git add JS/main.js
          git commit -m "Remove 10 remaining catalog entries that do not load"
          git push
