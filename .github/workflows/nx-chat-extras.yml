name: Add chat extras

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply chat extras
        run: |
          set -euo pipefail
          test "$(sha256sum chat/chat.js | cut -d' ' -f1)" = "7b09eb0ba70eaf3fb9652f7e1e44474a3e54db636af802d55cef26f969e769e6"
          test "$(sha256sum chat/chat.html | cut -d' ' -f1)" = "22989bc59ddde7e0d907969d2bf141176b71c008d1460e7e05eaf39debcfd6e1"
          test "$(sha256sum .github/nx-chat-extras.b64 | cut -d' ' -f1)" = "816ca43f33c2e2b1ca484f690611b67abc09814d85de0d968cecbb621c4ce9ef"
          base64 -d .github/nx-chat-extras.b64 | gunzip -c > /tmp/extras.js
          test "$(sha256sum /tmp/extras.js | cut -d' ' -f1)" = "090de3014ba64aaddca9aef374e927f20419065cfaf9e34f42bb4ae71f6c0a81"
          cat > /tmp/apply.py <<'PY'
          import pathlib
          js_path = pathlib.Path('chat/chat.js')
          js = js_path.read_text()
          extras = pathlib.Path('/tmp/extras.js').read_text()
          anchor = "\n\nif (document.getElementById('chat-messages')) {"
          assert js.count(anchor) == 1
          js = js.replace(anchor, "\n\n" + extras + anchor, 1)
          call = "    try { if (typeof window.nxInitUpcomingFeatures === 'function') window.nxInitUpcomingFeatures(); } catch (e) { console.warn(e); }"
          assert js.count(call) == 1
          js = js.replace(call, call + "\n\n    // Chat extras (drafts, paste/drop attach, shortcuts, sound, transcript)\n    try { if (typeof window.nxInitChatExtras === 'function') window.nxInitChatExtras(); } catch (e) { console.warn(e); }", 1)
          js_path.write_text(js)
          html_path = pathlib.Path('chat/chat.html')
          html = html_path.read_text()
          assert 'chat.js?v=20261127-pushmsg1' in html
          html_path.write_text(html.replace('chat.js?v=20261127-pushmsg1', 'chat.js?v=20261127-chatextras1'))
          PY
          python3 /tmp/apply.py
          test "$(sha256sum chat/chat.js | cut -d' ' -f1)" = "f70f4a04564c9c1432ae3bc158c161d70867d9bfb880a3a2d63a00cecbe05825"
          test "$(sha256sum chat/chat.html | cut -d' ' -f1)" = "5a12c6d61c4580cdb94e7012ae0f317af7fb8dba88ccf99003704e3b68d8c39a"
          node --check chat/chat.js

      - name: Remove one-off files
        run: rm .github/workflows/nx-chat-extras.yml .github/nx-chat-extras.b64

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat/chat.js chat/chat.html .github/workflows/nx-chat-extras.yml .github/nx-chat-extras.b64
          git commit -m "Add chat extras: drafts, image attach, shortcuts, sound, transcript export"
          git push
