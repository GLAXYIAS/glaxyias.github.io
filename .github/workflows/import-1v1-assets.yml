name: Import 1v1.lol assets

# Temporary helper. The Unity payload is far too large to commit from a local
# session, so this run downloads it once from the game's CDN, applies the mirror
# edits, and commits the result. It deletes itself and the migration script in
# the same commit.

on:
  push:
    paths:
      - .github/workflows/import-1v1-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-1v1-assets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Fetch the page shell
        shell: bash
        run: |
          set -euo pipefail
          GAME="Games/1v1-lol"
          SRC="https://1v1lolreloaded.com"
          CDN="https://cdn.1v1lolreloaded.com"
          mkdir -p "$GAME/js" "$GAME/mocks" "$GAME/fonts/blinker" "$GAME/Build" "$GAME/StreamingAssets/aa/WebGL"

          curl -fsSL --retry 3 -o "$GAME/index.html" "$SRC/index.html"
          curl -fsSL --retry 3 -o "$GAME/js/boot.js" "$SRC/js/boot.js"
          curl -fsSL --retry 3 -o "$GAME/js/bridges.js" "$SRC/js/bridges.js"
          curl -fsSL --retry 3 -o "$GAME/js/cdn-mirror.js" "$SRC/js/cdn-mirror.js"

          for f in server-mock firebase login firebase-config; do
            curl -fsSL --retry 3 -o "$GAME/mocks/$f.js" "$SRC/mocks/$f.js"
          done

          curl -fsSL --retry 3 -o "$GAME/fonts/dimbo.ttf" "$SRC/fonts/dimbo.ttf"
          curl -fsSL --retry 3 -o "$GAME/fonts/blinker/blinker-600.woff2" "$SRC/fonts/blinker/blinker-600.woff2"
          curl -fsSL --retry 3 -o "$GAME/loader-ch2-bg.jpg" "$SRC/loader-ch2-bg.jpg"

          curl -fsSL --retry 3 -o "$GAME/Build/WebGL.loader.js" "$SRC/Build/WebGL.loader.js"
          curl -fsSL --retry 3 -o "$GAME/Build/WebGL.framework.js.c0de4610.unityweb" "$CDN/Build/WebGL.framework.js.c0de4610.unityweb"

          curl -fsSL --retry 3 -o "$GAME/StreamingAssets/aa/settings.json" "$SRC/StreamingAssets/aa/settings.json"
          curl -fsSL --retry 3 -o "$GAME/StreamingAssets/aa/catalog.json" "$SRC/StreamingAssets/aa/catalog.json"

          curl -fsSL --retry 3 -o "$GAME/cover.webp" "https://azgames.io/upload/cache/upload/imgs/1v1lol-m200x200.webp"

      - name: Apply the mirror edits
        run: python3 tools/1v1-migrate.py

      - name: Download the Unity payload and asset bundles
        shell: bash
        run: |
          set -euo pipefail
          GAME="Games/1v1-lol"
          CDN="https://cdn.1v1lolreloaded.com"

          curl -fsSL --retry 3 -o /tmp/WebGL.data "$CDN/Build/WebGL.data.c0de4610.unityweb"
          echo "data bytes: $(wc -c < /tmp/WebGL.data)"
          split -b 64226101 -d -a 1 --numeric-suffixes=1 /tmp/WebGL.data "$GAME/Build/WebGL.data.c0de4610.unityweb.part"

          curl -fsSL --retry 3 -o "$GAME/Build/WebGL.wasm.c0de4610.unityweb" "$CDN/Build/WebGL.wasm.c0de4610.unityweb"
          echo "wasm bytes: $(wc -c < "$GAME/Build/WebGL.wasm.c0de4610.unityweb")"

          while read -r bundle; do
            [ -n "$bundle" ] || continue
            curl -fsSL --retry 3 -o "$GAME/StreamingAssets/aa/WebGL/$bundle" "$CDN/WebGL/$bundle"
          done <<'BUNDLES'
          32db710a57b37048e2f120c600c37a02_unitybuiltinshaders_19a57c0eac97959a8f5885f4c1122620.bundle
          emotesthumbnails_assets_all_acd236fc71f98a3b7054e5bbec39db96.bundle
          localization-asset-tables-english(en)_assets_all_94e9d0fa381ffa725d97e4e1dcd15e42.bundle
          localization-asset-tables-hebrew(he)_assets_all_02ece875f1966c8fad4fbd04259bfix2.bundle
          localization-asset-tables-spanish(es)_assets_all_7d7044650631ded152f77f1bf996fix2.bundle
          localization-assets-english(en)_assets_all_8e9dce135f2c59198b4cdb81daa39e91.bundle
          localization-assets-hebrew(he)_assets_all_4ae79e0caf6fd0f8510d9e0cb70b8708.bundle
          localization-assets-shared_assets_all_9340d3d0b9998e365e0f05ae04140397.bundle
          localization-assets-spanish(es)_assets_all_b61a4d5692071ebed38358580d2550e2.bundle
          localization-locales_assets_all_f1f0112f70efbd779c69236a8de85e1a.bundle
          localization-string-tables-english(en)_assets_all_fefebbafc23afd1d35baf73833d81166.bundle
          localization-string-tables-hebrew(he)_assets_all_b5c22c9783e3fe52174a46ec7128d572.bundle
          localization-string-tables-spanish(es)_assets_all_44360eb4f8081abc4546519137545fd7.bundle
          skinpacks_assets_all_6670358e079b78e8167f7540cd8123f8.bundle
          skinsthumbnails_assets_all_dc8096ed4f35c8091b9b111491327d32.bundle
          weaponskins_assets_all_3182912bab1ee29353dbf870e6e4fb3f.bundle
          BUNDLES

          du -sh "$GAME"
          ls -la "$GAME/Build"

      - name: Commit the mirror and remove the helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q tools/1v1-migrate.py
          git rm -q .github/workflows/import-1v1-assets.yml
          git add Games/1v1-lol index.html JS/profile-modal.js JS/fragen-17-games-v2.js
          git status --short | head -20
          git commit -m "Self-host 1v1.LOL and open the home profile panel without an iframe"
          git push
