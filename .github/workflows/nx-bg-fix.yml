name: Fix background picker and active nav

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply changes
        run: |
          curl -fsSL https://paste.rs/nxi35 -o /tmp/nx-bg-fix.py
          python3 /tmp/nx-bg-fix.py

      - name: Remove this one-off workflow
        run: rm .github/workflows/nx-bg-fix.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/themes.js CSS/black-orange.css index.html Settings/settings.html .github/workflows/nx-bg-fix.yml
          git commit -m "Fix background picker loop and active nav colors"
          git push
