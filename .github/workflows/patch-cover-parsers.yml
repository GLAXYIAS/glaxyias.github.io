name: Patch cover parsers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade object parser
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          NEW = '''def entries(source: str):
              """Yield every game object, including entries inside the GitLab/new-J IIFEs."""
              stack = []
              quote = False
              escape = False
              for i, ch in enumerate(source):
                  if quote:
                      if escape:
                          escape = False
                      elif ch == "\\\\":
                          escape = True
                      elif ch == '"':
                          quote = False
                      continue
                  if ch == '"':
                      quote = True
                  elif ch == "{":
                      stack.append(i)
                  elif ch == "}" and stack:
                      start = stack.pop()
                      obj = source[start:i + 1]
                      if ("id:" in obj and "title:" in obj and "url:" in obj
                              and obj.count("{") == 1 and obj.count("}") == 1):
                          yield start, i + 1, obj
          '''

          for name in ("scripts/add_actual_covers.py", "scripts/sharpen_game_tags.py"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r"def entries\(source: str\):.*?(?=\n\ndef )",
                  NEW + "\n",
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"parser block not found in {name}")
              path.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/add_actual_covers.py scripts/sharpen_game_tags.py
          git commit -m "Include appended games in cover and tag passes"
          git push origin HEAD:main
