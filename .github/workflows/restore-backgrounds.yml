name: restore-backgrounds
on:
  push:
    paths:
      - '.github/workflows/restore-backgrounds.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore every classic background in the picker
        run: |
          echo '' | base64 -d | gunzip > /tmp/bg-picker-block.js
          python3 - <<'PY2'
          from pathlib import Path
          import re, sys

          block = Path('/tmp/bg-picker-block.js').read_text()
          if block.count("['") < 38:
              sys.exit('catalog block looks truncated')
          if block.count('data-bg-key') != 3:
              sys.exit('picker markup missing')

          themes = Path('themes/themes.js')
          src = themes.read_text()
          marker = '/* Background picker used by the Settings page/modal. */'
          if marker not in src:
              sys.exit('picker marker not found in themes.js')
          themes.write_text(src[:src.index(marker)] + block)

          page = Path('Settings/settings.html')
          html = page.read_text()
          new_html, n = re.subn(r'themes/themes\.js\?v=[0-9A-Za-z]+', 'themes/themes.js?v=20261125allbg', html)
          if n != 1:
              sys.exit('expected one versioned themes.js tag, found %d' % n)
          page.write_text(new_html)
          print('patched themes.js and settings.html')
          PY2
          node --check themes/themes.js
      - name: Commit, clean up the workflow, and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "glaxyias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add themes/themes.js Settings/settings.html
          git commit -m "fix: restore every classic background inside the background picker"
          git push
          git rm .github/workflows/restore-backgrounds.yml
          git commit -m "chore: remove the one-shot background restore workflow"
          git push
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "deploy dispatched"
