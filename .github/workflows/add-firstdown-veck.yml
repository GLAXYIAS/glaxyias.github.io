name: Add First Down side games and Veck.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-firstdown-veck.yml

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the catalog is unchanged
        run: |
          echo "afc6efaa367bbbe5cd973f442b6db1f074d6426d5336255aa52d56f5ead95e6b  JS/main.js" | sha256sum --check --strict

      - name: Fetch cover images
        shell: bash
        run: |
          set -euo pipefail
          og() {
            curl -sL -A 'Mozilla/5.0' "https://www.firstdown.studio/$1" \
              | grep -o 'https://www\.firstdown\.studio/[^"\\]*opengraph-image\.png[^"\\]*' \
              | head -n 1
          }
          mkdir -p Games/_covers/actual
          u82="$(og build-a-82-0-team/)"; echo "82-0 cover: $u82"; test -n "$u82"
          u162="$(og build-a-162-0-team/)"; echo "162-0 cover: $u162"; test -n "$u162"
          ugoat="$(og build-the-goat-team/)"; echo "GOAT cover: $ugoats"; test -n "$ugoats"
          curl -fsSL --retry 4 -A 'Mozilla/5.0' "$u82" -o Games/_covers/actual/firstdown-82.png
          curl -fsSL --retry 4 -A 'Mozilla/5.0' "$u162" -o Games/_covers/actual/firstdown-162.png
          curl -fsSL --retry 4 -A 'Mozilla/5.0' "$ugoats" -o Games/_covers/actual/firstdown-goat.png
          curl -fsSL --retry 4 -A 'Mozilla/5.0' 'https://glaxyias.github.io/veck.io/logo-v2.webp' -o Games/_covers/actual/veck-io.webp
          file Games/_covers/actual/firstdown-82.png Games/_covers/actual/firstdown-162.png Games/_covers/actual/firstdown-goat.png Games/_covers/actual/veck-io.webp

      - name: Insert catalog cards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'JS/main.js';
          let src = fs.readFileSync(file, 'utf8');
          if (src.includes('id: "firstdown-82-0"')) {
            console.log('cards already present');
            process.exit(0);
          }
          const anchor = [
            '  {',
            '    id: "17-and-0",',
            '    title: "17 And 0",',
            '    url: "https://whatchamacallitexe.github.io/17-and-0/index.html",',
            '    desc: "Play 17 And 0 online in your browser.",',
            '    popular: false',
            '  },',
          ].join('\n');
          if (!src.includes(anchor)) {
            console.error('anchor not found in JS/main.js');
            process.exit(1);
          }
          const games = [
            {
              id: 'firstdown-82-0',
              title: 'Build A 82-0 Team',
              url: 'https://whatchamacallitexe.github.io/17-and-0/build-a-82-0-team/',
              image: '../Games/_covers/actual/firstdown-82.png',
              desc: 'Spin random NBA teams, draft a starting five and a head coach, and chase an undefeated 82-0 season.',
              tags: ['Sports', 'Basketball'],
            },
            {
              id: 'firstdown-162-0',
              title: 'Build A 162-0 Team',
              url: 'https://whatchamacallitexe.github.io/17-and-0/build-a-162-0-team/',
              image: '../Games/_covers/actual/firstdown-162.png',
              desc: 'Spin random MLB teams and draft a full lineup plus DH to build a perfect 162-0 baseball season.',
              tags: ['Sports', 'Baseball'],
            },
            {
              id: 'firstdown-goat',
              title: 'Build The GOAT Team',
              url: 'https://whatchamacallitexe.github.io/17-and-0/build-the-goat-team/',
              image: '../Games/_covers/actual/firstdown-goat.png',
              desc: 'Draft seven NFL legends from random team-seasons and build the highest-scoring GOAT roster.',
              tags: ['Sports', 'Football'],
            },
            {
              id: 'veck-io',
              title: 'Veck.io',
              url: 'https://glaxyias.github.io/veck.io/',
              image: '../Games/_covers/actual/veck-io.webp',
              desc: 'Fast low-poly FPS deathmatch. Pick a loadout and fight bots in a neon arena, right in your browser.',
              tags: ['Shooter', 'Action', 'Multiplayer'],
            },
          ];
          const lines = games.map((g) => '  {\n' +
            '    id: ' + JSON.stringify(g.id) + ',\n' +
            '    title: ' + JSON.stringify(g.title) + ',\n' +
            '    url: ' + JSON.stringify(g.url) + ',\n' +
            '    image: ' + JSON.stringify(g.image) + ',\n' +
            '    desc: ' + JSON.stringify(g.desc) + ',\n' +
            '    popular: false,\n' +
            '    tags: ' + JSON.stringify(g.tags) + '\n' +
            '  },').join('\n');
          src = src.replace(anchor, anchor + '\n' + lines);
          fs.writeFileSync(file, src);
          console.log('added', games.length, 'cards');
          NODE

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JS/main.js Games/_covers/actual
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add First Down 82-0, 162-0, GOAT and Veck.io to the catalog"
          git push
