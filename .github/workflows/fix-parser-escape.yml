name: Fix parser escape

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix backslash literal
        run: |
          python - <<'PY'
          from pathlib import Path

          old = r'elif ch == "\":'
          new = r'elif ch == "\\":'

          for name in ("scripts/add_actual_covers.py", "scripts/sharpen_game_tags.py"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"bad line not found in {name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/add_actual_covers.py scripts/sharpen_game_tags.py
          git commit -m "Fix escaped backslash in cover parser"
          git push origin HEAD:main
