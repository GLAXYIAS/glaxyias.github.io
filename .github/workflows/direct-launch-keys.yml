name: direct launch key reset

on:
  push:
    paths:
      - '.github/workflows/direct-launch-keys.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reset the player setting key
        run: |
          python3 - <<'PY'
          import sys

          def patch(path, pairs):
              with open(path, encoding="utf-8", newline="") as f:
                  s = f.read()
              for old, new in pairs:
                  n = s.count(old)
                  if n != 1:
                      sys.exit("FAILED %s: %d matches for %r" % (path, n, old[:90]))
                  s = s.replace(old, new)
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(s)
              print("patched", path)

          patch("JS/main.js", [
              (
                  '  // Games open as normal pages by default. Forcing every title, Unity/WebGL\n'
                  '  // builds included, through the player iframe is what left some of them\n'
                  '  // black, so the in-page player is now opt-in from Settings.\n'
                  '  var useIframe = false;\n'
                  '  try {\n'
                  '    useIframe = localStorage.getItem("nx_use_iframe") === "true";\n',
                  '  // Games open as normal pages by default. The player iframe is opt-in from\n'
                  '  // Settings; the old nx_use_iframe key is ignored on purpose so a stale\n'
                  '  // "true" from the forced-iframe default cannot keep wrapping every game.\n'
                  '  var useIframe = false;\n'
                  '  try {\n'
                  '    useIframe = localStorage.getItem("nx_use_iframe_v2") === "true";\n'
              ),
              (
                  "              // default OFF: games launch straight from the card, no iframe\n"
                  "              iframeToggle.checked = localStorage.getItem('nx_use_iframe') === 'true';\n",
                  "              // default OFF: games launch straight from the card, no iframe\n"
                  "              iframeToggle.checked = localStorage.getItem('nx_use_iframe_v2') === 'true';\n"
              ),
              (
                  "                localStorage.setItem('nx_use_iframe', e.target.checked ? 'true' : 'false');\n",
                  "                localStorage.setItem('nx_use_iframe_v2', e.target.checked ? 'true' : 'false');\n"
              ),
          ])

          patch("Settings/standalone-settings.js", [
              (
                  "    checkbox.checked = read('nx_use_iframe', 'false') === 'true';\n",
                  "    checkbox.checked = read('nx_use_iframe_v2', 'false') === 'true';\n"
              ),
              (
                  "      write('nx_use_iframe', checkbox.checked ? 'true' : 'false');\n",
                  "      write('nx_use_iframe_v2', checkbox.checked ? 'true' : 'false');\n"
              ),
          ])

          patch("index.html", [
              (
                  '<script src="JS/main.js?v=20261113fix2"></script>',
                  '<script src="JS/main.js?v=20261125direct"></script>'
              ),
          ])
          PY

      - name: Commit and remove this workflow
        run: |
          git config user.name "glaxyias-site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git rm -q .github/workflows/direct-launch-keys.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 1
          fi
          git commit -m "fix: reset the iframe player preference so games open directly"
          git push origin HEAD:main

      - name: Ask Pages to deploy the new commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches" \
            -d '{"ref":"main"}' \
            -w "\nHTTP %{http_code}\n"
