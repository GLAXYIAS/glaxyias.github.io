name: Apply orange system-news styles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply changes
        run: python3 .github/scripts/nx-news-orange.py

      - name: Remove this one-off workflow
        run: |
          rm .github/workflows/nx-news-orange.yml
          rm .github/scripts/nx-news-orange.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/themes.js index.html .github/workflows/nx-news-orange.yml .github/scripts/nx-news-orange.py
          git commit -m "Make system news accents orange and cache-bust theme script"
          git push
