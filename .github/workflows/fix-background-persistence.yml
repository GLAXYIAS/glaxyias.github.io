name: fix-background-persistence
on:
  push:
    paths:
      - '.github/workflows/fix-background-persistence.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer the preserved theme name over the dashboard's overwritten key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          p = Path('themes/themes.js')
          s = p.read_text()
          old = "\n".join([
              "  function storedTheme() {",
              "    try {",
              "      var raw = localStorage.getItem('nxup_theme');",
              "      if (raw) {",
              "        var parsed = JSON.parse(raw);",
              "        if (typeof parsed === 'string' && parsed) return parsed;",
              "      }",
              "    } catch (e) {}",
              "    var selected = '';",
              "    try { selected = localStorage.getItem('selectedTheme') || ''; } catch (e) {}",
              "    if (selected === 'default' || !selected) return 'purple';",
              "    return PALETTES[selected] ? selected : 'purple';",
              "  }",
          ])
          new = "\n".join([
              "  function storedTheme() {",
              "    var selected = '';",
              "    try { selected = localStorage.getItem('selectedTheme') || ''; } catch (e) {}",
              "    if (selected === 'default' || !selected) return 'purple';",
              "    if (PALETTES[selected]) return selected;",
              "    try {",
              "      var raw = localStorage.getItem('nxup_theme');",
              "      if (raw) {",
              "        var parsed = JSON.parse(raw);",
              "        if (typeof parsed === 'string' && parsed && PALETTES[parsed]) return parsed;",
              "      }",
              "    } catch (e) {}",
              "    return 'purple';",
              "  }",
          ])
          if s.count(old) != 1:
              sys.exit('storedTheme block not found exactly once: %d' % s.count(old))
          p.write_text(s.replace(old, new))

          page = Path('Settings/settings.html')
          html = page.read_text()
          html2, n = re.subn(r'themes/themes\.js\?v=[0-9A-Za-z]+', 'themes/themes.js?v=20261125allbg3', html)
          if n != 1:
              sys.exit('expected one themes.js tag, found %d' % n)
          page.write_text(html2)
          print('stored theme priority fixed')
          PY
          node --check themes/themes.js
      - name: Commit, clean up, and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "glaxyias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add themes/themes.js Settings/settings.html
          git commit -m "fix: keep the chosen background after visiting the dashboard"
          git push
          git rm .github/workflows/fix-background-persistence.yml
          git commit -m "chore: remove the one-shot background persistence workflow"
          git push
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches" \
            -d '{"ref":"main"}'
