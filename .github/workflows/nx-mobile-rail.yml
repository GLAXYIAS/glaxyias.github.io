name: nx mobile rail fix

on:
  push:
    paths:
      - ".github/workflows/nx-mobile-rail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fit all eight rail items on the phone bar
        run: |
          python3 - <<'PY'
          import sys

          path = "brand new start up screen/index.html"
          src = open(path, encoding="utf-8").read()

          subs = [
              (".rail__group{flex-direction:row;flex:1;overflow-x:auto;scrollbar-width:none}",
               ".rail__group{flex-direction:row;flex:1 1 auto;min-width:0;overflow:hidden;scrollbar-width:none}"),
              (".rail__foot{flex-direction:row;margin-top:0;padding-top:0}",
               ".rail__foot{flex:0 0 auto;flex-direction:row;margin-top:0;padding-top:0}"),
              (".rail__item{flex:1 0 62px;justify-content:center;padding:10px 2px 8px;gap:5px}",
               ".rail__item{flex:1 1 0;min-width:0;justify-content:center;padding:9px 1px 7px;gap:4px}"),
              (".rail__item span{font-size:7px}",
               ".rail__item span{font-size:6.5px;letter-spacing:.04em}"),
          ]

          for old, new in subs:
              n = src.count(old)
              if n != 1:
                  raise SystemExit("expected 1 match, got %d for %s" % (n, old))
              src = src.replace(old, new, 1)

          style = src.split("<style>", 1)[1].split("</style>", 1)[0]
          if style.count("{") != style.count("}"):
              raise SystemExit("unbalanced css braces")

          open(path, "w", encoding="utf-8").write(src)
          print("patched %d rules" % len(subs))
          PY

      - name: Commit and retire this workflow
        run: |
          rm -f .github/workflows/nx-mobile-rail.yml
          git config user.name "glaxyias"
          git config user.email "Sparefornow2026@outlook.com"
          git add "brand new start up screen/index.html"
          git add -A .github/workflows/nx-mobile-rail.yml
          git commit -m "startup screen: fit the full bottom bar on phones"
          git push
