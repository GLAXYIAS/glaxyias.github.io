name: Remove unplayable game entries
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prune catalog
        env:
          LINES: "10,32,34,35,36,37,38,39,40,41,53,75,81,93,126,129,161,162,164,170,174,176,180,188,191,192,202,207,224,226,238,246,257,259,266,282,319,326,333,340,361,382,396,403,578,711,907,1040,1355,1425,1537,1572,1831,1915,1922,1957,2146,2153,2160,2167,2293,2300,2321,2328,2335,2342,2349,2419,2440,2447,2468,2489,2496,2643,2664,2706,2713,2811,2930,2958,3014,3042,3147,3161,3168,3189,3196,3203,3231,3238,3301,3308,3322,3406,3469,3476,3518,3546,3588,3616,3630,3672,3721,3728,3749,3763,3770,3791,3819,3826,3840,3854,3861,3910,3938,3973,3987,4064,4071,4092,4099,4134,4141,4176,4218,4232,4295,4309,4372,4400,4449,4575,4617,4631,4638,4645,4694,4715,4827,4841,4848,4862,4883,4911,5044,5058,5079,5086,5114,5184,5219,5247,5331,5359,5366,5373,5415,5492,5513,5541,5548,5569,5576,5583,5590,5597,5611,5653,5667,5800,5933,5940,6003,6017,6052,6059,6094,6220,6395,6402,6444,6458,6479,6542,6549,6563,6570,6598,6605,6752,6766,6822,6829,6836,6850,6857,6864,6871,6906,6934,6941,6948,6955,6962,6969,6983,6997,7039,7060,7067,7088,7095,7158,7200,7221,7228,7242,7256,7270,7277,7305,7312,7347,7354,7375,7396,7403,7424,7459,7480,7550,7564,7571,7578,7585,7620,7634,7648,7655,7690,7697,7704,7711,7725,7732,7746,7753,7767,7788,7802,7809,7816,7823,7837,7844,7851,7865,7872,7879,7886,7900,7914,7949,7963,7970,7977,7984,8166,8222,8278,8285,8327,8600,8607,8719,8726,8873,8943,9055,9111,9195,9209,9216,9251,9293,9342,9349,9363"
          EXPECTED_SHA: "9bc7515dd2232d96c9db0e37d951bcadc2758c029613e415ed08f803cb7e0167"
        run: |
          python3 - <<'PY'
          import os, hashlib
          p = 'JS/main.js'
          src = open(p, encoding='utf-8').read()
          sha = hashlib.sha256(src.encode()).hexdigest()
          assert sha == os.environ['EXPECTED_SHA'], 'unexpected main.js: ' + sha
          lines = src.split('\n')
          drop = {int(x) for x in os.environ['LINES'].split(',')}
          out = [line for i, line in enumerate(lines, 1) if i not in drop]
          open(p, 'w', encoding='utf-8').write('\n'.join(out))
          print('removed', len(lines) - len(out), 'remaining', len(out))
          PY
      - name: Commit
        run: |
          git config user.name "glaxyias-bot"
          git config user.email "bot@users.noreply.github.com"
          git add JS/main.js
          git commit -m "Remove 288 catalog entries whose game files are missing or dead"
          git push
