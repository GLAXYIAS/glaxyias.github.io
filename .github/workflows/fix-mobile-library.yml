name: Fix mobile Games and Saved (one-shot)

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-library.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply mobile library fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('brand-new-start-up-screen/index.html')
          src = path.read_text(encoding='utf-8')
          replacements = [
              ('''body.is-library .aside,
          body.is-library .foot{display:none}''',
               '''body.is-library .aside,
          body.is-library .foot{display:none}
          body.is-saved .chips{display:none}'''),
              ('''  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 11px}''',
               '''  .chips{
              flex-wrap:nowrap;
              overflow-x:auto;
              margin:0 calc(var(--pad) * -1) 18px;
              padding:0 var(--pad) 2px;
              scrollbar-width:none;
              -webkit-overflow-scrolling:touch;
            }
            .chips::-webkit-scrollbar{display:none}
            .chips .chip{flex:none}

            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 11px}'''),
              ('''  .game__fav{opacity:1;transform:none;width:24px;height:24px}''',
               '''  .game__fav{opacity:1;transform:none;top:6px;right:6px;width:32px;height:32px}
            .game__fav::before{content:"";position:absolute;inset:-6px}
            .game__fav svg{width:15px;height:15px}'''),
              ('''  .toast{left:12px;right:12px;transform:translateY(14px);text-align:center}''',
               '''  .toast{left:12px;right:12px;bottom:74px;transform:translateY(14px);text-align:center}'''),
              ('''    document.body.classList.toggle("is-library", inLibrary);''',
               '''    document.body.classList.toggle("is-library", inLibrary);
              document.body.classList.toggle("is-saved", view === "saved");'''),
              ('''    els.favNote.hidden = !state.favsOnly;''',
               '''    els.favNote.hidden = !state.favsOnly || isEmpty;'''),
          ]
          for old, new in replacements:
              if src.count(old) != 1:
                  raise SystemExit('Expected exactly one match: ' + old[:80])
              src = src.replace(old, new, 1)
          path.write_text(src, encoding='utf-8')
          print('mobile fixes applied')
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('brand-new-start-up-screen/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          pathlib.Path('/tmp/homepage.js').write_text(scripts[-1], encoding='utf-8')
          for token in ['body.is-saved .chips{display:none}', '.game__fav::before{content:"";position:absolute;inset:-6px}', 'bottom:74px', 'classList.toggle("is-saved"', '!state.favsOnly || isEmpty']:
              if token not in html:
                  raise SystemExit('missing ' + token)
          print('structure OK')
          PY
          node --check /tmp/homepage.js

      - name: Commit and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-new-start-up-screen/index.html
          git rm .github/workflows/fix-mobile-library.yml
          git commit -m "Fix the mobile library layout and favorite controls"
          pushed=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 5
            git pull --rebase origin main
          done
          test "$pushed" = 1
          sleep 5
          gh workflow run static.yml --ref main
