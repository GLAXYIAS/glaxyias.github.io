name: Add Fragen and 17-0 cards

on:
  push:
    paths:
      - .github/workflows/fragen-17-cards.yml

permissions:
  contents: write

jobs:
  add-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add catalog files, covers, and loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Games/fragen Games/17-and-0 Games/_covers/actual
          cat > JS/fragen-17-games.js <<'JS'
          /* Fragen and 17-0 catalog additions. Loaded after JS/main.js. */
          (function () {
            "use strict";

            var additions = [
              {
                id: "fragen",
                title: "Fragen",
                url: "Games/fragen/index.html",
                image: "Games/_covers/actual/fragen.jpg",
                desc: "Intense multiplayer FPS combat. Pick a mode, customize your arsenal, and fight solo or with friends.",
                popular: true,
                tags: ["Shooter", "Action", "Multiplayer"]
              },
              {
                id: "17_and_0",
                title: "17-0",
                url: "Games/17-and-0/index.html",
                image: "Games/_covers/actual/17-and-0.png",
                desc: "Spin for an NFL franchise and era, draft legends, and simulate a perfect 17-0 season.",
                popular: true,
                tags: ["Sports", "Simulation"]
              }
            ];

            var installed = false;

            function install() {
              if (installed) return true;
              if (typeof _0xData === "undefined" || !Array.isArray(_0xData)) return false;

              var existing = Object.create(null);
              for (var i = 0; i < _0xData.length; i++) {
                if (_0xData[i] && _0xData[i].id != null) existing[String(_0xData[i].id)] = true;
              }

              var missing = additions.filter(function (game) {
                return !existing[String(game.id)];
              });
              for (var j = missing.length - 1; j >= 0; j--) {
                _0xData.unshift(missing[j]);
              }
              installed = true;

              if (typeof renderLibraryGrid === "function") {
                try {
                  renderLibraryGrid(_0xData);
                } catch (error) {
                  console.error("[Fragen catalog]", error);
                }
              }
              return true;
            }

            install();
            var tries = 0;
            var wait = setInterval(function () {
              tries++;
              if (install() || tries >= 80) clearInterval(wait);
            }, 50);

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", install);
            } else {
              install();
            }
            window.addEventListener("load", function () {
              setTimeout(install, 50);
            });
          })();
          JS

          cat > Games/fragen/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Fragen</title>
            <meta name="description" content="Play Fragen, a fast-paced multiplayer browser FPS.">
            <meta http-equiv="refresh" content="0; url=https://whatchamacallitexe.github.io/fragen/">
            <style>
              html, body {
                margin: 0; padding: 0; height: 100%;
                background: #090c15; color: #e9d5ff;
                font-family: system-ui, sans-serif;
                display: flex; align-items: center; justify-content: center;
                text-align: center;
              }
              a { color: #e9d5ff; font-weight: bold; }
            </style>
            <script>
              (function () {
                var target = "https://whatchamacallitexe.github.io/fragen/";
                try {
                  if (window.top && window.top !== window) {
                    window.top.location.replace(target);
                    return;
                  }
                } catch (e) {}
                window.location.replace(target);
              })();
            </script>
          </head>
          <body>
            <div>
              <p>Loading Fragen…</p>
              <p>If you are not redirected, <a href="https://whatchamacallitexe.github.io/fragen/" target="_top">click here</a>.</p>
            </div>
          </body>
          </html>
          HTML

          cat > Games/17-and-0/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>17-0</title>
            <meta name="description" content="Build a 17-0 NFL team and simulate a perfect season.">
            <meta http-equiv="refresh" content="0; url=https://whatchamacallitexe.github.io/17-and-0/">
            <style>
              html, body {
                margin: 0; padding: 0; height: 100%;
                background: #11100f; color: #ffd29a;
                font-family: system-ui, sans-serif;
                display: flex; align-items: center; justify-content: center;
                text-align: center;
              }
              a { color: #ffd29a; font-weight: bold; }
            </style>
            <script>
              (function () {
                var target = "https://whatchamacallitexe.github.io/17-and-0/";
                try {
                  if (window.top && window.top !== window) {
                    window.top.location.replace(target);
                    return;
                  }
                } catch (e) {}
                window.location.replace(target);
              })();
            </script>
          </head>
          <body>
            <div>
              <p>Loading 17-0…</p>
              <p>If you are not redirected, <a href="https://whatchamacallitexe.github.io/17-and-0/" target="_top">click here</a>.</p>
            </div>
          </body>
          </html>
          HTML

          curl -fsSL -A 'Mozilla/5.0' 'https://imgs.crazygames.com/fragen_16x9/20251022094210/fragen_16x9-cover?metadata=none&quality=100&width=1200&height=630&fit=crop&resizer=covers' -o Games/_covers/actual/fragen.jpg
          curl -fsSL -A 'Mozilla/5.0' 'https://www.firstdown.studio/build-a-17-0-team/opengraph-image.png?3e4b55213c17f3b6' -o Games/_covers/actual/17-and-0.png

          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text()
          needle = '    <script src="JS/main.js?v=20261113fix1"></script>'
          extra = '    <script src="JS/fragen-17-games.js?v=20261117"></script>'
          if extra not in html:
              if html.count(needle) != 1:
                  raise SystemExit("main.js script tag not found exactly once")
              html = html.replace(needle, needle + "\n" + extra, 1)
              path.write_text(html)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html JS/fragen-17-games.js Games/fragen/index.html Games/17-and-0/index.html Games/_covers/actual/fragen.jpg Games/_covers/actual/17-and-0.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Fragen and 17-0 game cards"
          git push
