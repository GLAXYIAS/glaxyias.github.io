name: Publish Tower Page
on:
  push:
    paths:
      - Games/undead-corridor/tower-page.b64
  workflow_dispatch:
permissions:
  contents: write
jobs:
  write-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write the page from the compressed payload
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = Path('Games/undead-corridor/tower-page.b64').read_text().strip()
          Path('Games/undead-corridor/index.html').write_bytes(gzip.decompress(base64.b64decode(payload)))
          Path('Games/undead-corridor/tower-page.b64').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Games/undead-corridor/index.html Games/undead-corridor/tower-page.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish the Tower rooftop mode'
          git push
