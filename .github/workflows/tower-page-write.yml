name: Publish Tower Page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  write-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the Tower page
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          corridor = Path('Games/undead-corridor')
          corridor.joinpath('index.html').write_bytes(gzip.decompress(corridor.joinpath('tower-page.b64').read_bytes()))
          for chunk in corridor.glob('tower-page.part*'):
              chunk.unlink()
          corridor.joinpath('tower-page.b64').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Games/undead-corridor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish the Tower rooftop mode'
          git push
