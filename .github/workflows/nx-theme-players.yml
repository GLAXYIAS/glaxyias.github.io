name: Theme motion and player filters
on:
  push:
    paths:
      - '.github/workflows/nx-theme-players.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme and player patch
        shell: python
        run: |
          import gzip
          with open('.github/nx-patch.b64', 'rb') as fh:
              code = gzip.decompress(fh.read()).decode('utf-8')
          exec(compile(code, 'patch_site_v2.py', 'exec'), {'__name__': '__main__'})
      - name: Add Stickman Battle cover
        run: |
          mkdir -p Games/_covers/actual
          curl -fsSL "https://img.poki-cdn.com/cdn-cgi/image/q=78,scq=50,width=1200,height=1200,fit=cover,f=png/e45cb1ace089e65d02091d60896e3a35/stickman-battle-logo.png" -o Games/_covers/actual/stickman-battle.png
          test -s Games/_covers/actual/stickman-battle.png
      - name: Commit changes and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/themes.js JS/main.js index.html Settings/settings.html CSS/style.css CSS/upgrade-pack.css Games/_covers/actual/stickman-battle.png
          git commit -m "Animate theme backgrounds, theme accent chrome, add player filters and Stickman Battle"
          git rm .github/workflows/nx-theme-players.yml .github/nx-patch.b64
          git commit -m "Remove one-shot theme/player workflow"
          git push
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/GLAXYIAS/glaxyias.github.io/actions/workflows/static.yml/dispatches \
            -d '{"ref":"main"}'
