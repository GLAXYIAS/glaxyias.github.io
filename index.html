<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>Glaxyias Has Moved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f4f5;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.18), transparent 32%),
        radial-gradient(circle at 80% 75%, rgba(139, 92, 246, 0.13), transparent 34%),
        #09090b;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      background: rgba(99, 102, 241, 0.12);
      pointer-events: none;
      animation: drift 8s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -130px;
      left: -110px;
    }

    .glow.two {
      right: -120px;
      bottom: -140px;
      animation-delay: -3s;
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(30px, 18px, 0) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(680px, 100%);
      padding: 48px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 24px;
      background: rgba(20, 20, 24, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding: 8px 13px;
      border: 1px solid rgba(129, 140, 248, 0.22);
      border-radius: 999px;
      color: #c7d2fe;
      background: rgba(99, 102, 241, 0.08);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #818cf8;
      box-shadow: 0 0 14px rgba(129, 140, 248, 0.9);
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(2.2rem, 6vw, 4.4rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 800;
    }

    h1 span {
      display: block;
      margin-top: 7px;
      color: #a5b4fc;
    }

    .description {
      max-width: 530px;
      margin: 0 auto 30px;
      color: #a1a1aa;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .url-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      margin-bottom: 16px;
      padding: 12px 16px;
      overflow-wrap: anywhere;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
      color: #d4d4d8;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 56px;
      padding: 0 22px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 14px;
      text-decoration: none;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      box-shadow: 0 12px 35px rgba(99, 102, 241, 0.23);
      font-size: 0.98rem;
      font-weight: 750;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 16px 44px rgba(99, 102, 241, 0.32);
    }

    .button:active {
      transform: translateY(0);
    }

    .arrow {
      font-size: 1.15rem;
      transition: transform 180ms ease;
    }

    .button:hover .arrow {
      transform: translateX(4px);
    }

    .footer {
      margin-top: 22px;
      color: #52525b;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
    }

    @media (max-width: 600px) {
      .card {
        padding: 34px 22px;
        border-radius: 20px;
      }

      .description {
        font-size: 0.98rem;
      }

      .url-box {
        font-size: 0.78rem;
      }
    }
  </style>
</head>

<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      Location Updated
    </div>

    <h1>
      Glaxyias
      <span>Has Been Moved.</span>
    </h1>

    <p class="description">
      Due to privacy reasons, Glaxyias is no longer hosted at this location.
      The site has been moved to a new address.
    </p>

    <div class="url-box">
      https://null-x-team.github.io/Null-X-Team/
    </div>

    <a
      class="button"
      href="https://null-x-team.github.io/Null-X-Team/"
      rel="noopener noreferrer"
    >
      Continue to the new site
      <span class="arrow">→</span>
    </a>

    <div class="footer">
      Please update any saved bookmarks or links.
    </div>
  </main>
</body>
</html>
