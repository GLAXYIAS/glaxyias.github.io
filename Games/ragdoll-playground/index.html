<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ragdoll Playground</title>
<style>
  html,body{margin:0;height:100%;background:#16181e;overflow:hidden;overscroll-behavior:none;font-family:"Trebuchet MS",system-ui,sans-serif}
  #unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#16181e;outline:none;touch-action:none}
  #topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;pointer-events:none}
  #topbar a,#topbar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
    background:rgba(10,8,12,.72);color:#f3e7d8;border:1px solid rgba(255,255,255,.18);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
  #topbar a:hover,#topbar button:hover{border-color:#f8cb00;color:#fff}
  #progress-panel{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% 35%,#241d16,#0a0806 70%);color:#f3e7d8;text-align:center;padding:24px}
  #progress-panel h1{margin:0;font-size:clamp(1.2rem,3vw,1.8rem);letter-spacing:.04em}
  #progress-track{width:min(420px,80vw);height:9px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#f8cb00,#ff7a3c);transition:width .25s ease}
  #progress-text{margin:0;font-size:.85rem;opacity:.8}
  #ad-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(4,3,2,.94);padding:20px}
  #ad-overlay.show{display:flex}
  .ad-card{width:min(720px,94vw);border:1px solid rgba(248,203,0,.3);border-radius:16px;background:#0d0b09;
    box-shadow:0 30px 90px rgba(0,0,0,.7);overflow:hidden;text-align:center}
  .ad-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:#b9a98e;border-bottom:1px solid rgba(255,255,255,.08)}
  .ad-body{padding:clamp(24px,5vw,52px) 22px;background:
    radial-gradient(ellipse at 50% 0%,rgba(248,203,0,.09),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 12px,transparent 12px 24px)}
  .ad-body h2{margin:0 0 10px;font-size:clamp(1.15rem,3.4vw,1.7rem);color:#fff}
  .ad-body p{margin:0;color:#cbb99f;font-size:.95rem}
  .ad-art{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 18px;width:86px;height:86px;
    border-radius:20px;border:1px solid rgba(248,203,0,.35);background:linear-gradient(145deg,#221a0c,#0b0906);font-size:34px}
  .ad-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:9px}
  #ad-countdown{font-size:.86rem;color:#f8cb00;font-weight:700;letter-spacing:.04em}
  #ad-track{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  #ad-fill{height:100%;width:100%;background:linear-gradient(90deg,#f8cb00,#ff7a3c)}
  #error-panel{position:fixed;inset:0;z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#120d0a;color:#ffd9c2;text-align:center;padding:24px;font-size:.95rem}
  #error-panel.show{display:flex}
  #error-panel button{padding:9px 16px;border-radius:9px;border:1px solid #f8cb00;background:#2a2113;color:#f8cb00;font-weight:700;cursor:pointer}
  @media (max-width:520px){#topbar a,#topbar button{padding:6px 9px;font-size:12px}}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>

<div id="topbar">
  <a href="/index.html" title="Back to the game library">&larr; Games</a>
  <button type="button" id="fs-btn" title="Full screen">&#9974; Full screen</button>
</div>

<div id="progress-panel">
  <h1>Ragdoll Playground</h1>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <p id="progress-text">Preparing game&hellip;</p>
</div>

<div id="ad-overlay" role="dialog" aria-label="Advertisement">
  <div class="ad-card">
    <div class="ad-head"><span>Advertisement</span><span>Sponsored slot</span></div>
    <div class="ad-body">
      <div class="ad-art">AD</div>
      <h2>In-game ad would appear here</h2>
      <p>The real ad is skipped. This placeholder takes its place so the game continues normally.</p>
    </div>
    <div class="ad-foot">
      <div id="ad-countdown">Resuming in 5&hellip;</div>
      <div id="ad-track"><div id="ad-fill"></div></div>
    </div>
  </div>
</div>

<div id="error-panel">
  <strong>The game could not start.</strong>
  <span id="error-text">Try reloading the page.</span>
  <button type="button" onclick="location.reload()">Reload</button>
</div>

<script>
/* ------------------------------------------------------------------ settings */
var GAME_BASE = location.href.replace(/[^/]*$/, "");
var buildUrl = "Build";
var config = {
  dataUrl: buildUrl + "/ragdoll-playground-v25041512.data.unityweb",
  frameworkUrl: buildUrl + "/ragdoll-playground-v25041512.framework.js.unityweb",
  codeUrl: buildUrl + "/ragdoll-playground-v25041512.wasm.unityweb",
  streamingAssetsUrl: GAME_BASE + "25041512/StreamingAssets",
  companyName: "azgames.io",
  productName: "Ragdoll Playground",
  productVersion: "25041512"
};
config.gameId = "ragdoll-playground";
config.eventLog = false;
config.enableMoreGame = "no";
config.enablePromotion = false;

/* ------------------------------------------------------- placeholder ad flow */
var adOverlay = document.getElementById("ad-overlay");
var adCountdown = document.getElementById("ad-countdown");
var adFill = document.getElementById("ad-fill");
var adCallback = null;
var adRunning = false;

function showPlaceholderAd(seconds, onDone) {
  adCallback = onDone || null;
  adRunning = true;
  var left = seconds;
  adCountdown.textContent = "Resuming in " + left + "\u2026";
  adFill.style.transition = "none";
  adFill.style.width = "100%";
  adOverlay.classList.add("show");
  requestAnimationFrame(function () {
    adFill.style.transition = "width " + seconds + "s linear";
    adFill.style.width = "0%";
  });
  var timer = setInterval(function () {
    left -= 1;
    if (left > 0) {
      adCountdown.textContent = "Resuming in " + left + "\u2026";
      return;
    }
    clearInterval(timer);
    adCountdown.textContent = "Resuming\u2026";
    adOverlay.classList.remove("show");
    adRunning = false;
    var cb = adCallback;
    adCallback = null;
    if (typeof cb === "function") { try { cb(); } catch (e) {} }
  }, 1000);
}

function placeholderAdCallback(options) {
  if (!options) return null;
  if (typeof options === "function") return options;
  if (typeof options.onComplete === "function") return options.onComplete;
  if (typeof options.onAdComplete === "function") return options.onAdComplete;
  if (typeof options.callback === "function") return options.callback;
  return null;
}
function installAdPlaceholders() {
  window.gmStartAds = function (done) { showPlaceholderAd(5, done); };
  window.ads_h5 = function (options) { showPlaceholderAd(5, placeholderAdCallback(options)); };
  window.ads_wgplayer = window.ads_h5;
}
function firebaseSetUserProperties() {}
function firebaseLogEvent() {}
function firebaseLogEventParameter() {}

/* --------------------------------------------------------------- build start */
var progressFill = document.getElementById("progress-fill");
var progressText = document.getElementById("progress-text");
var progressPanel = document.getElementById("progress-panel");
var adDone = false;
var gameReady = false;

function maybeReveal() {
  if (!adDone) return;
  if (!gameReady) { progressText.textContent = "Loading game\u2026"; return; }
  progressPanel.style.display = "none";
}

showPlaceholderAd(5, function () { adDone = true; maybeReveal(); });

function startUnity() {
  var loader = document.createElement("script");
  loader.src = buildUrl + "/ragdoll-playground-v25041512.loader.js";
  loader.onload = function () {
    createUnityInstance(document.getElementById("unity-canvas"), config, function (p) {
      progressFill.style.width = Math.round(p * 100) + "%";
      progressText.textContent = "Loading game\u2026 " + Math.round(p * 100) + "%";
    }).then(function (instance) {
      window.unityInstance = instance;
      gameReady = true;
      maybeReveal();
      try { window.focus(); } catch (e) {}
    }).catch(function (err) {
      document.getElementById("error-text").textContent = String(err || "Unknown error");
      document.getElementById("error-panel").classList.add("show");
    });
  };
  loader.onerror = function () {
    document.getElementById("error-text").textContent = "Could not load the game files.";
    document.getElementById("error-panel").classList.add("show");
  };
  document.body.appendChild(loader);
}

/* The ads SDK is intentionally not loaded. It refuses unknown hosts and blanks
   the game; the game only needs the flags below, and ad calls go to our
   placeholder overlay instead of a real network. */
window.GMSOFT_OPTIONS = {
  allow_host: "yes",
  allow_play: "yes",
  enableAds: false,
  enable_ads: "no",
  sdkType: "h5",
  unlock_timer: -1,
  timeShowInter: 60,
  timeShowReward: 60,
  debug_mode: "no",
  hostindex: 1
};
/* Keep in-game links from sending players back to the ad-supported host. */
var nativeWindowOpen = window.open;
window.open = function (url) {
  if (url && /azgames?\.io/i.test(String(url))) return null;
  return nativeWindowOpen.apply(window, arguments);
};
var sdkStub = document.createElement("script");
sdkStub.id = "gmsoft-jssdk";
document.body.appendChild(sdkStub);
installAdPlaceholders();
startUnity();

/* ----------------------------------------------------------------- controls */
document.getElementById("fs-btn").addEventListener("click", function () {
  var el = document.documentElement;
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});
</script>
</body>
</html>
