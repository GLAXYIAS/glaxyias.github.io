<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Ragdoll Playground</title>
  <style>
    html,body{margin:0;height:100%;background:#16181e;overflow:hidden;overscroll-behavior:none}
    #stage{position:fixed;inset:0}
    iframe{display:block;width:100%;height:100%;border:0;background:#16181e}
    #status{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
      background:#16181e;color:#f3e7d8;font-family:"Trebuchet MS",system-ui,sans-serif;text-align:center;padding:24px;
      transition:opacity .35s ease;z-index:2}
    #status.hide{opacity:0;pointer-events:none}
    #status .dot{width:34px;height:34px;border-radius:50%;border:3px solid rgba(248,203,0,.25);border-top-color:#f8cb00;
      animation:spin 1s linear infinite}
    #status p{margin:0;font-size:.95rem;opacity:.8}
    #status a{color:#f8cb00;font-weight:700}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="stage">
    <iframe id="game" src="https://game.azgame.io/ragdoll-playground/"
      title="Ragdoll Playground"
      allow="autoplay; fullscreen; gamepad; clipboard-write; pointer-lock"
      allowfullscreen></iframe>
  </div>
  <div id="status">
    <div class="dot"></div>
    <strong>Loading Ragdoll Playground…</strong>
    <p>If the game does not start, <a href="https://game.azgame.io/ragdoll-playground/" target="_blank" rel="noopener">open it in a new tab</a>.</p>
  </div>
  <script>
    (function () {
      var frame = document.getElementById("game");
      var status = document.getElementById("status");
      function hide() { status.classList.add("hide"); }
      frame.addEventListener("load", function () { setTimeout(hide, 900); });
      setTimeout(hide, 12000);
    })();
  </script>
</body>
</html>
