<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bullet Force</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading-text {
      position: fixed; top: 20px; left: 0; right: 0; z-index: 10;
      color: #fff; font-size: 22px; font-family: system-ui, sans-serif;
      text-align: center; pointer-events: none;
    }
    #nx-error {
      display: none; position: fixed; inset: 0; z-index: 999999;
      background: #0a0a0a; color: #eee; font-family: system-ui, sans-serif;
      padding: 24px; box-sizing: border-box; overflow: auto;
    }
    #nx-error h1 { color: #ff5555; }
    #nx-error code {
      display: block; background: #1a1a1a; padding: 12px; border-radius: 8px;
      white-space: pre-wrap; word-break: break-word; margin: 12px 0; border: 1px solid #333;
    }
    #nx-error a { color: #8b5cf6; }
  </style>
</head>
<body>
  <div id="nx-error">
    <h1>Bullet Force could not start</h1>
    <code id="nx-error-msg"></code>
    <p>This game is ~500 MB. If you see <b>429</b> or corrupt file errors, wait 1–2 minutes and refresh.</p>
    <p><a href="/">← Back to Null X</a></p>
  </div>
  <div id="loading-text">LOADING Bullet Force…</div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script>
  (function () {
    var loadingText = document.getElementById("loading-text");
    var canvas = document.getElementById("unity-canvas");

    var BASES = [
      "https://fastly.jsdelivr.net/gh/bubbls/UGS-Assets@main/bullet-force-multiplayer/",
      "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/bullet-force-multiplayer/",
      "https://gcore.jsdelivr.net/gh/bubbls/UGS-Assets@main/bullet-force-multiplayer/",
      "https://raw.githubusercontent.com/bubbls/UGS-Assets/main/bullet-force-multiplayer/"
    ];

    // Known split layout from UGS-Assets (avoids HEAD probes that also 429)
    var FILES = [
      {
        name: "584aaab0eb92d84ef26110ca5439bc54.wasm.gz",
        parts: 8,
        sizes: [20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 2401991]
      },
      {
        name: "7edaab9530d578d742b70ec34add0032.data.gz",
        parts: 19,
        sizes: [20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 20866662, 5183944]
      }
    ];

    var totalExpected = 0;
    FILES.forEach(function (f) {
      f.sizes.forEach(function (s) { totalExpected += s; });
    });
    var loadedBytes = 0;

    function showFatal(msg) {
      console.error("[BulletForce]", msg);
      loadingText.textContent = "FAILED TO LOAD";
      loadingText.style.color = "#ff5555";
      document.getElementById("nx-error-msg").textContent = String(msg);
      document.getElementById("nx-error").style.display = "block";
    }

    function sleep(ms) {
      return new Promise(function (r) { setTimeout(r, ms); });
    }

    function setProgress(label) {
      var mb = (loadedBytes / (1024 * 1024)).toFixed(1);
      var tot = (totalExpected / (1024 * 1024)).toFixed(0);
      loadingText.textContent = label + " — " + mb + " / ~" + tot + " MB";
    }

    async function fetchPart(path, expectedSize) {
      var lastErr = null;
      for (var b = 0; b < BASES.length; b++) {
        var url = BASES[b] + path;
        for (var attempt = 0; attempt < 3; attempt++) {
          try {
            setProgress("Downloading " + path.split("/").pop());
            var res = await fetch(url);
            if (res.status === 429) {
              lastErr = new Error("429 rate limit: " + url);
              await sleep(2000 * (attempt + 1));
              continue;
            }
            if (!res.ok) {
              lastErr = new Error("HTTP " + res.status + " " + url);
              continue;
            }
            var buf = await res.arrayBuffer();
            var u8 = new Uint8Array(buf);
            // 429 text body starts with "429"
            if (u8.length >= 3 && u8[0] === 0x34 && u8[1] === 0x32 && u8[2] === 0x39) {
              lastErr = new Error("CDN 429 body for " + path);
              await sleep(2000 * (attempt + 1));
              continue;
            }
            if (expectedSize && Math.abs(u8.length - expectedSize) > 2048) {
              lastErr = new Error("Size mismatch " + path + " got " + u8.length + " expected " + expectedSize);
              continue;
            }
            loadedBytes += u8.length;
            setProgress("Downloaded");
            return buf;
          } catch (e) {
            lastErr = e;
            await sleep(1000 * (attempt + 1));
          }
        }
      }
      throw lastErr || new Error("Failed " + path);
    }

    async function mergeFile(fileInfo) {
      var buffers = [];
      for (var i = 1; i <= fileInfo.parts; i++) {
        var path = "Build/" + fileInfo.name + ".part" + i;
        buffers.push(await fetchPart(path, fileInfo.sizes[i - 1]));
      }
      // gzip magic 1f 8b
      var head = new Uint8Array(buffers[0].slice(0, 2));
      if (!(head[0] === 0x1f && head[1] === 0x8b)) {
        throw new Error(
          "Corrupt " + fileInfo.name + " (bad gzip magic). CDN rate-limit likely — wait and refresh."
        );
      }
      return URL.createObjectURL(new Blob(buffers, { type: "application/gzip" }));
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    (async function () {
      try {
        if (!(function () {
          try {
            var c = document.createElement("canvas");
            return !!c.getContext("webgl2") || !!c.getContext("webgl");
          } catch (e) { return false; }
        })()) {
          throw new Error("WebGL not available. Enable hardware acceleration.");
        }

        var mergedMap = {};
        for (var f = 0; f < FILES.length; f++) {
          setProgress("Merging " + FILES[f].name);
          mergedMap[FILES[f].name] = await mergeFile(FILES[f]);
        }

        var activeBase = BASES[0];
        var origFetch = window.fetch;
        window.fetch = async function (resource, options) {
          if (typeof resource === "string") {
            var key = resource.split("/").pop();
            if (mergedMap[key]) return origFetch(mergedMap[key], options);
          }
          return origFetch(resource, options);
        };

        var OrigXHR = window.XMLHttpRequest;
        window.XMLHttpRequest = function () {
          var xhr = new OrigXHR();
          var origOpen = xhr.open;
          xhr.open = function (method, url) {
            var rest = Array.prototype.slice.call(arguments, 2);
            var key = String(url).split("/").pop();
            if (mergedMap[key]) {
              return origOpen.apply(xhr, [method, mergedMap[key]].concat(rest));
            }
            return origOpen.apply(xhr, arguments);
          };
          return xhr;
        };

        var config = {
          dataUrl: "Build/7edaab9530d578d742b70ec34add0032.data.gz",
          frameworkUrl: activeBase + "Build/fd74eec22ed0b1f79484c6a782ad39af.framework.js",
          codeUrl: "Build/584aaab0eb92d84ef26110ca5439bc54.wasm.gz",
          streamingAssetsUrl: activeBase + "StreamingAssets",
          companyName: "Bullet Force",
          productName: "Bullet Force",
          productVersion: "1.0.0"
        };

        setProgress("Starting Unity");
        await new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = activeBase + "Build/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js";
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Failed to load Unity loader")); };
          document.body.appendChild(script);
        });

        if (typeof createUnityInstance !== "function") {
          throw new Error("createUnityInstance missing");
        }

        await createUnityInstance(canvas, config, function (p) {
          loadingText.textContent = "STARTING… " + Math.round(p * 100) + "%";
        });
        loadingText.style.display = "none";
      } catch (err) {
        showFatal(err && (err.message || err) || String(err));
      }
    })();
  })();
  </script>
</body>
</html>
