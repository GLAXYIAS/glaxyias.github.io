<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Moto X3M 3</title>
<script src="/JS/adblock.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58d9d25357dc8597da2691dc003f35c4ca25ac65/apap.css" type="text/css" />
<style>
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
  #content { position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #content canvas { display: block; }
</style>
</head>
<body>
<div id="content"></div>
<div id="orientation"></div>
<div id="loader">Loading ...</div>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58d9d25357dc8597da2691dc003f35c4ca25ac65/napem.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58d9d25357dc8597da2691dc003f35c4ca25ac65/draw.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58d9d25357dc8597da2691dc003f35c4ca25ac65/jq.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58d9d25357dc8597da2691dc003f35c4ca25ac65/ease.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58d9d25357dc8597da2691dc003f35c4ca25ac65/bluemin.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58d9d25357dc8597da2691dc003f35c4ca25ac65/moto3.js"></script>
<script>
(function () {
  function fit() {
    var c = document.querySelector('#content canvas');
    if (!c || !c.width || !c.height) return;
    var s = Math.min(window.innerWidth / c.width, window.innerHeight / c.height);
    c.style.setProperty('width', Math.round(c.width * s) + 'px', 'important');
    c.style.setProperty('height', Math.round(c.height * s) + 'px', 'important');
  }
  window.addEventListener('resize', fit);
  setInterval(fit, 400);
})();
</script>
</body>
</html>
