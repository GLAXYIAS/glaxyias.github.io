<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ace Combat 3 - Electrosphere</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      box-sizing: border-box;
    }
    #game {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      max-width: 100%;
      max-height: 100%;
      background: #000;
    }
    #loading-progress {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      padding: 10px 16px; background: rgba(255,255,255,0.12); border-radius: 8px;
      z-index: 10; pointer-events: none;
    }
    #start-btn {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center; flex-direction: column;
      gap: 16px;
    }
    #start-btn button {
      background: #0064ff; color: #fff; border: none; border-radius: 10px;
      padding: 14px 28px; font-size: 18px; font-weight: 700; cursor: pointer;
    }
    #start-btn p { color: #aaa; margin: 0; font-size: 14px; }
    #err {
      display: none; position: fixed; inset: 0; background: #0a0a0a;
      padding: 24px; box-sizing: border-box; z-index: 999; overflow: auto;
    }
    #err code {
      display: block; background: #1a1a1a; padding: 12px; border-radius: 8px;
      white-space: pre-wrap; word-break: break-word; margin: 12px 0;
    }
    #err a { color: #8b5cf6; }
  </style>
</head>
<body>
  <div id="err"><h1>Ace Combat 3 failed to load</h1><code id="err-msg"></code><p><a href="/">← Back</a></p></div>
  <div id="loading-progress">Loading: 0/22</div>
  <div id="start-btn">
    <button type="button" id="start-click">▶ Start Ace Combat 3</button>
    <p>ROM ready — click to start (required for audio / WebGL)</p>
  </div>
  <div id="wrap"><div id="game"></div></div>

  <script>
  (function () {
    var CHD_PATH = "ace%20combat%203/Ace%20Combat%203%20-%20Electrosphere%20(USA).chd";
    var ROM_NAME = "Ace Combat 3 - Electrosphere (USA).chd";
    var BASES = [
      "https://fastly.jsdelivr.net/gh/bubbls/ugss@6ae566604fe7593c3cd8e4fbb5b595b284b0537d/",
      "https://cdn.jsdelivr.net/gh/bubbls/ugss@6ae566604fe7593c3cd8e4fbb5b595b284b0537d/",
      "https://gcore.jsdelivr.net/gh/bubbls/ugss@6ae566604fe7593c3cd8e4fbb5b595b284b0537d/"
    ];
    var EJS_LOADERS = [
      { loader: "https://cdn.emulatorjs.org/stable/data/loader.js", data: "https://cdn.emulatorjs.org/stable/data/" },
      { loader: "https://cdn.emulatorjs.org/latest/data/loader.js", data: "https://cdn.emulatorjs.org/latest/data/" },
      { loader: "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js", data: "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/" }
    ];
    var MIN = 1, MAX = 22;
    var progressEl = document.getElementById("loading-progress");
    var startBtn = document.getElementById("start-btn");
    var romFile = null;

    function showErr(msg) {
      console.error(msg);
      document.getElementById("err-msg").textContent = String(msg);
      document.getElementById("err").style.display = "block";
      if (progressEl) progressEl.textContent = "Error";
      if (startBtn) startBtn.style.display = "none";
    }

    function sleep(ms) {
      return new Promise(function (r) { setTimeout(r, ms); });
    }

    function partUrl(base, i) {
      return base + CHD_PATH + ".part" + String(i).padStart(2, "0");
    }

    async function fetchPart(i) {
      var lastErr = null;
      for (var b = 0; b < BASES.length; b++) {
        var url = partUrl(BASES[b], i);
        for (var attempt = 0; attempt < 3; attempt++) {
          try {
            var res = await fetch(url);
            if (res.status === 429) {
              lastErr = new Error("429 on part " + i);
              await sleep(1500 * (attempt + 1));
              continue;
            }
            if (!res.ok) {
              lastErr = new Error("HTTP " + res.status + " part " + i);
              continue;
            }
            var buf = await res.arrayBuffer();
            var u8 = new Uint8Array(buf);
            if (u8.length >= 3 && u8[0] === 0x34 && u8[1] === 0x32 && u8[2] === 0x39) {
              lastErr = new Error("429 body on part " + i);
              await sleep(1500 * (attempt + 1));
              continue;
            }
            if (u8.length < 1000) {
              lastErr = new Error("Part " + i + " too small");
              continue;
            }
            return buf;
          } catch (e) {
            lastErr = e;
            await sleep(800 * (attempt + 1));
          }
        }
      }
      throw lastErr || new Error("Failed part " + i);
    }

    async function mergeAll() {
      var buffers = [];
      for (var i = MIN; i <= MAX; i++) {
        progressEl.textContent = "Loading ROM: " + (i - MIN + 1) + "/" + (MAX - MIN + 1);
        buffers.push(await fetchPart(i));
      }
      romFile = new File(buffers, ROM_NAME, { type: "application/octet-stream" });
      var head = new Uint8Array(await romFile.slice(0, 8).arrayBuffer());
      var magic = String.fromCharCode.apply(null, head);
      if (magic.indexOf("MComprHD") !== 0) {
        throw new Error("Merged file is not a valid CHD (header: " + magic + ")");
      }
      progressEl.textContent = "ROM ready (" + (romFile.size / (1024 * 1024)).toFixed(0) + " MB)";
      return romFile;
    }

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement("script");
        script.src = src;
        script.onload = function () { resolve(src); };
        script.onerror = function () { reject(new Error("Failed script " + src)); };
        document.body.appendChild(script);
      });
    }

    async function startEmulator() {
      if (!romFile) throw new Error("ROM not ready");

      window.EJS_player = "#game";
      window.EJS_core = "psx";
      window.EJS_gameName = "Ace Combat 3 - Electrosphere";
      window.EJS_color = "#0064ff";
      window.EJS_startOnLoaded = true;
      window.EJS_gameUrl = romFile;
      window.EJS_biosUrl =
        "https://cdn.jsdelivr.net/gh/Abdess/retroarch_system@5f96368f6dbad5851cdb16a5041fefec4bdcd305/Sony%20-%20PlayStation/scph5501.bin";

      var lastErr = null;
      for (var i = 0; i < EJS_LOADERS.length; i++) {
        try {
          window.EJS_pathtodata = EJS_LOADERS[i].data;
          progressEl.textContent = "Loading emulator…";
          await loadScript(EJS_LOADERS[i].loader);
          if (progressEl && progressEl.parentNode) progressEl.remove();
          return;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("Failed to load emulator from all CDNs");
    }

    mergeAll()
      .then(function () {
        if (progressEl) progressEl.style.display = "none";
        startBtn.style.display = "flex";
        document.getElementById("start-click").onclick = function () {
          startBtn.style.display = "none";
          if (progressEl) {
            progressEl.style.display = "block";
            progressEl.textContent = "Starting…";
          }
          startEmulator().catch(showErr);
        };
      })
      .catch(showErr);
  })();
  </script>
</body>
</html>
