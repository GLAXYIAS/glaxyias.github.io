<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070505">
  <title>Undead Corridor | AZ Games</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070505; color: #f4e9dc; }
    body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; text-align: center; }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: .05em; }
    p { margin: 0 0 22px; color: #9d8585; font-size: 14px; }
    a { display: inline-block; padding: 12px 24px; border-radius: 8px; background: #ffd84d; color: #140b0b; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Undead Corridor</h1>
    <p id="msg">Opening the game&hellip;</p>
    <a id="open" href="https://gamea.azgame.io/undead-corridor/" target="_blank" rel="noopener">Play Undead Corridor</a>
  </main>
  <script>
    (function () {
      var GAME = 'https://gamea.azgame.io/undead-corridor/';
      var framed = false;
      try { framed = window.top !== window.self; } catch (e) { framed = true; }

      /* A top-level page is the only reliable way to run this game. */
      if (!framed) {
        window.location.replace(GAME);
        return;
      }

      /* Older site shells still frame game pages. Never nest the game again:
         show a button that opens it as its own tab. */
      document.getElementById('msg').textContent = 'This game needs its own tab.';
      document.getElementById('open').addEventListener('click', function (event) {
        event.preventDefault();
        var win = null;
        try { win = window.open(GAME, '_blank', 'noopener'); } catch (e) {}
        if (!win) window.location.href = GAME;
      });
    })();
  </script>
</body>
</html>
